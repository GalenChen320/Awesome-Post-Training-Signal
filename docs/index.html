els for General Agents", "arxiv": "2606.24597", "date": "2026-06", "domain": "Tool & API", "affiliations": ["Alibaba"], "code": "https://github.com/QwenLM/Qwen-AgentWorld", "data": "https://huggingface.co/collections/Qwen/qwen-agentworld", "summary_en": "Trains language world models that predict next environment states across seven domains, used as controllable simulators for agentic RL.", "summary_zh": "训练预测 7 类环境下一状态的语言世界模型，作为 Agentic RL 的可控模拟器。"}, {"name": "PROVE", "title": "Synthesize and Reward -- Reinforcement Learning for Multi-Step Tool Use in Live Environments", "arxiv": "2606.03892", "date": "2026-06", "domain": "Tool & API", "affiliations": ["IBM"], "code": "", "data": "", "summary_en": "Session-isolated stateful MCP servers plus a state-machine pipeline that synthesizes tasks grounded in live server state with programmatic rewards.", "summary_zh": "会话隔离的有状态 MCP 服务，配合状态机流水线基于实时服务状态合成任务并给出程序化奖励。"}, {"name": "LiteCoder-Terminal", "title": "LiteCoder-Terminal: Scaling Long-Horizon Terminal Environments for Learning Language Agents", "arxiv": "2605.29559", "date": "2026-05", "domain": "Terminal", "affiliations": ["ISCAS", "UCAS"], "code": "", "data": "", "summary_en": "Zero-dependency pipeline synthesizing executable, verifiable long-horizon terminal environments directly from domain specifications.", "summary_zh": "不依赖外部仓库，直接从领域规格合成可执行、可验证的长程终端环境。"}, {"name": "PhoneWorld", "title": "PhoneWorld: From Real-App Trajectories to Dynamic and Verifiable Environments for Phone-Use Agents", "arxiv": "2605.29486", "date": "2026-05", "domain": "Web & GUI", "affiliations": ["Renmin University of China", "Tencent", "CUHK (Shenzhen)"], "code": "https://github.com/EthanLeo-LYX/PhoneWorld", "data": "https://huggingface.co/datasets/EthanLeoLYX/PhoneWorld-APKs", "summary_en": "Converts real-app trajectories into rebuilt dynamic Android apps with backend state, enabling verifiable phone-use RL tasks.", "summary_zh": "把真实 App 轨迹转化为带后端状态的重建 Android App，支持可验证的手机操作 RL 任务。"}, {"name": "ScaleWoB", "title": "ScaleWoB: Guiding GUI Agents with Coding Agents via Large-Scale Environmental Synthesis", "arxiv": "2605.25160", "date": "2026-05", "domain": "Web & GUI", "affiliations": ["Tsinghua University", "UESTC", "Xiaomi"], "code": "", "data": "", "summary_en": "Coding agents synthesize interactive web and mobile apps with verifiable tasks at scale for GUI agent training.", "summary_zh": "编码 Agent 大规模合成可交互的网页与移动 App 及可验证任务，用于 GUI Agent 训练。"}, {"name": "Terminal-World", "title": "Terminal-World: Scaling Terminal-Agent Environments via Agent Skills", "arxiv": "2605.20876", "date": "2026-05", "domain": "Terminal", "affiliations": ["Beihang University", "Beijing Institute of Technology", "University of Edinburgh"], "code": "", "data": "", "summary_en": "Uses agent skills as the synthesis primitive to co-derive instructions, environments, verifiers and teacher trajectories.", "summary_zh": "以 Agent 技能为合成单元，同时推导任务指令、环境、验证器与教师轨迹。"}, {"name": "EnvFactory", "title": "EnvFactory: Scaling Tool-Use Agents via Executable Environments Synthesis and Robust RL", "arxiv": "2605.18703", "date": "2026-05", "domain": "Tool & API", "affiliations": ["HKUST (Guangzhou)", "University of Cambridge", "UCL"], "code": "https://github.com/LARK-AI-Lab/EnvFactory", "data": "https://huggingface.co/datasets/LARK-Lab/EnvFactory-RL", "summary_en": "Search, coding and testing agents build verified stateful MCP environments from real resources; topology-aware sampling creates implicit-intent tasks.", "summary_zh": "搜索/编码/测试三类 Agent 基于真实资源构建经验证的有状态 MCP 环境，拓扑感知采样生成隐式意图任务。"}, {"name": "EvoEnv", "title": "Learning to Build the Environment: Self-Evolving Reasoning RL via Verifiable Environment Synthesis", "arxiv": "2605.14392", "date": "2026-05", "domain": "Reasoning", "affiliations": ["Tencent"], "code": "", "data": "", "summary_en": "The policy itself synthesizes new verifiable Python environments from seeds, co-evolving environment building and reasoning in one RL loop.", "summary_zh": " gent 将真实网站复刻为可访问数据库的可执行沙盒，支持可程序化验证的任务。"}, {"name": "RepoLaunch", "title": "RepoLaunch: Automating Build and Management of Code Repositories across Languages and Platforms", "arxiv": "2603.05026", "date": "2026-03", "domain": "SWE", "affiliations": ["Microsoft"], "code": "https://github.com/microsoft/RepoLaunch", "data": "", "summary_en": "Agentic framework that resolves dependencies, compiles and extracts test results across languages and OSes for automated SWE task generation.", "summary_zh": "跨语言、跨操作系统自动解决依赖、编译并抽取测试结果，驱动全自动 SWE 任务生成。"}, {"name": "Reasoning Core", "title": "Reasoning Core: A Scalable Procedural Data Generation Suite for Symbolic Pre-training and Post-Training", "arxiv": "2603.02208", "date": "2026-03", "domain": "Reasoning", "affiliations": ["Université de Lille", "Inria", "CNRS"], "code": "https://github.com/sileod/reasoning_core", "data": "", "summary_en": "Procedural generators over planning, logic, grammars and probabilistic inference, verified by external solvers with continuous difficulty control.", "summary_zh": "覆盖规划、逻辑、文法与概率推断的程序化生成器，由外部求解器验证，难度连续可调。"}, {"name": "SWE-rebench V2", "title": "SWE-rebench V2: Language-Agnostic SWE Task Collection at Scale", "arxiv": "2602.23866", "date": "2026-02", "domain": "SWE", "affiliations": ["Nebius"], "code": "", "data": "https://huggingface.co/datasets/nebius/SWE-rebench-V2", "summary_en": "An interactive setup agent synthesizes repo-specific install and test procedures across 20 languages, with LLM-judge filtering.", "summary_zh": "交互式配置 Agent 为 20 种语言的仓库合成安装与测试流程，并以 LLM 评审过滤。"}, {"name": "Nemotron-Terminal", "title": "On Data Engineering for Scaling LLM Terminal Capabilities", "arxiv": "2602.21193", "date": "2026-02", "domain": "Terminal", "affiliations": ["NVIDIA"], "code": "", "data": "https://huggingface.co/collections/nvidia/nemotron-terminal", "summary_en": "Seed- and skill-based terminal task generation executed in Dockerized environments, with a systematic study of terminal data engineering.", "summary_zh": "基于种子与技能的终端任务生成并在 Docker 环境中执行，系统研究终端数据工程策略。"}, {"name": "ReSyn", "title": "ReSyn: Autonomously Scaling Synthetic Environments for Reasoning Models", "arxiv": "2602.20117", "date": "2026-02", "domain": "Reasoning", "affiliations": ["CMU", "Amazon"], "code": "", "data": "", "summary_en": "LLM pipeline autonomously writes instance generators and verifiers for diverse reasoning environments to scale RLVR.", "summary_zh": "LLM 流水线自动为多样推理环境编写实例生成器与验证器，以扩展 RLVR。"}, {"name": "AutoWebWorld", "title": "AutoWebWorld: Synthesizing Infinite Verifiable Web Environments via Finite State Machines", "arxiv": "2602.14296", "date": "2026-02", "domain": "Web & GUI", "affiliations": ["HKUST (Guangzhou)", "DeepWisdom", "Peking University"], "code": "", "data": "", "summary_en": "Models websites as finite state machines and code-generates web environments whose FSM states make task success verifiable.", "summary_zh": "将网站建模为有限状态机并据此生成网页环境，由 FSM 状态判定任务成功。"}, {"name": "AWM", "title": "Agent World Model: Infinity Synthetic Environments for Agentic Reinforcement Learning", "arxiv": "2602.10090", "date": "2026-02", "domain": "Tool & API", "affiliations": ["UNC Chapel Hill", "Snowflake"], "code": "https://github.com/Snowflake-Labs/agent-world-model", "data": "https://huggingface.co/datasets/Snowflake/AgentWorldModel-1K", "summary_en": "LLM writes DB schema, data, API spec, MCP server code and SQL verifiers from seed scenarios, yielding SQLite-backed executable environments.", "summary_zh": "由 LLM 从种子场景依次生成库表、数据、API 规范、MCP 服务代码与 SQL 校验器，得到 SQLite 支撑的可执行环境。"}, {"name": "TermiGen", "title": "TermiGen: High-Fidelity Environment and Robust Trajectory Synthesis for Terminal Agents", "arxiv": "2602.07274", "date": "2026-02", "domain": "Terminal", "affiliations": ["UC Santa Barbara", "UC San Diego", "AMD"], "code": "https://github.com/ucsb-mlsec/terminal-bench-env", "data": "", "summary_en": "Multi-agent refinement loop generates verified tasks and Docker containers; a generator-critic C", "Xi'an Jiaotong University"], "code": "", "data": "", "summary_en": "A teacher LLM synthesizes tasks and tool ecosystems, then serves mock tools and simulated users with rubric-based rewards for RL.", "summary_zh": "教师模型合成任务与工具生态，并以模拟工具、模拟用户和 rubric 奖励支撑 RL 训练。"}, {"name": "Endless Terminals", "title": "Endless Terminals: Scaling RL Environments for Terminal Agents", "arxiv": "2601.16443", "date": "2026-01", "domain": "Terminal", "affiliations": ["Stanford University", "Microsoft", "University of Wisconsin-Madison"], "code": "https://github.com/kanishkg/endless-terminals", "data": "", "summary_en": "Fully autonomous pipeline generating terminal tasks, validated containers, completion tests and solvability filters for RL.", "summary_zh": "全自动生成终端任务、经验证的容器、完成态测试，并按可解性过滤，用于 RL。"}, {"name": "EnvScaler", "title": "EnvScaler: Scaling Tool-Interactive Environments for LLM Agent via Programmatic Synthesis", "arxiv": "2601.05808", "date": "2026-01", "domain": "Tool & API", "affiliations": ["Renmin University of China"], "code": "https://github.com/RUC-NLPIR/EnvScaler", "data": "https://huggingface.co/datasets/XXHStudyHard/EnvScaler-191-Env", "summary_en": "Mines topics into stateful Python environment skeletons, then generates initial states, tasks and rule-based validators for SFT/RL.", "summary_zh": "从主题挖掘出有状态的 Python 环境骨架，再生成初始状态、任务与基于规则的校验函数，用于 SFT/RL。"}, {"name": "InfiniteWeb", "title": "InfiniteWeb: Scalable Web Environment Synthesis for GUI Agent Training", "arxiv": "2601.04126", "date": "2026-01", "domain": "Web & GUI", "affiliations": ["Microsoft", "Peking University", "Nanjing University"], "code": "https://github.com/microsoft/FIVE-UI-Evol", "data": "", "summary_en": "Generates functional websites via unified specs and task-centric test-driven development, with auto-generated evaluators for GUI RL.", "summary_zh": "通过统一规格与以任务为中心的测试驱动开发生成可用网站，并自动生成评估器用于 GUI RL。"}, {"name": "AutoForge", "title": "AutoForge: Automated Environment Synthesis for Agentic Reinforcement Learning", "arxiv": "2512.22857", "date": "2025-12", "domain": "Tool & API", "affiliations": ["Alibaba"], "code": "", "data": "", "summary_en": "Unified pipeline synthesizing simulated environments with hard-but-verifiable tasks, plus an environment-level RL algorithm robust to user-simulator noise.", "summary_zh": "统一流水线合成带高难度、易验证任务的模拟环境，并提出对模拟用户噪声鲁棒的环境级 RL 算法。"}, {"name": "GenEnv", "title": "GenEnv: Difficulty-Aligned Co-Evolution Between LLM Agents and Environment Simulators", "arxiv": "2512.19682", "date": "2025-12", "domain": "Game & Embodied", "affiliations": ["Princeton University", "ByteDance", "Columbia University"], "code": "https://github.com/Gen-Verse/GenEnv", "data": "", "summary_en": "An LLM environment simulator generates tasks aligned to the agent's current difficulty, co-evolving with the agent through RL.", "summary_zh": "LLM 环境模拟器按 Agent 当前能力生成难度匹配的任务，并与 Agent 在 RL 中共同进化。"}, {"name": "SSR", "title": "Toward Training Superintelligent Software Agents through Self-Play SWE-RL", "arxiv": "2512.18552", "date": "2025-12", "domain": "SWE", "affiliations": ["Meta", "UIUC", "CMU"], "code": "", "data": "", "summary_en": "A single policy self-plays bug injection and repair in sandboxed repos, with bugs specified by agent-proposed test patches.", "summary_zh": "同一策略在沙箱仓库中自博弈地注入与修复 bug，bug 由 Agent 自行提出的测试补丁定义。"}, {"name": "SWE-Playground", "title": "Training Versatile Coding Agents in Synthetic Environments", "arxiv": "2512.12216", "date": "2025-12", "domain": "SWE", "affiliations": ["Tsinghua University", "CMU"], "code": "https://github.com/neulab/SWE-Playground", "data": "", "summary_en": "LLM agents synthesize entire projects, task decompositions, scaffolds and unit tests from scratch, without existing repositories.", "summary_zh": "由 LLM Agent 从零生成完整项目、任务拆分、代码骨架与单元测试，不依赖现有仓库。"}, {"name": "GTM", "title": "GTM: Simulating the World of Tools for AI Agents", "arxiv": "2512.04535", "date": "2025-12", "domain": "Tool & API", "affiliations": ["Zhongguancun Academy", "Fudan University"], "code": "", "data": "", "summary_en": "Trains a 1.5B universal tool simulator that replaces real tool execution during agent RL via prompt-level configuration.", "summary_zh": "训练 1.5B 通用工具模拟器，仅靠提示配置即可在 Agent RL 中替代真实工具执行。"}, {"name": "AutoEnv", "title": "AutoEnv: Automated Environments for Measuring Cross-Environment Agent Learning", "arxiv": "2511.19304", "date": "2025-11", "domain": "Game & Embodied", "affiliations": ["HKUST (Guangzhou)", "DeepWisdom", "Peking University"], "code": "https://github.com/FoundationAgents/AutoEnv", "data": "", "summary_en": "Factorizes environments into transitions, observations and rewards so LLMs can generate heterogeneous executable worlds at low cost.", "summary_zh": "将环境分解为状态转移、观测与奖励，使 LLM 能低成本生成异构的可执行世界。"}, {"name": "SynthTools", "title": "SynthTools: A Framework for Scaling Synthetic Tools for Agent Development", "arxiv": "2511.09572", "date": "2025-11", "domain": "Tool & API", "affiliations": ["University of Chicago", "Columbia University"], "code": "https://github.com/namkoong-lab/SynthTools", "data": "", "summary_en": "Hierarchically generates domain tool environments, simulates and audits tools with LLMs, and builds verifiable tasks with initial/final states.", "summary_zh": "分层生成各领域工具环境，用 LLM 模拟并审计工具，构造带初始/终止状态的可验证任务。"}, {"name": "RLVE", "title": "RLVE: Scaling Up Reinforcement Learning for Language Models with Adaptive Verifiable Environments", "arxiv": "2511.07317", "date": "2025-11", "domain": "Reasoning", "affiliations": ["University of Washington", "AI2", "UIUC"], "code": "https://github.com/Zhiyuan-Zeng/RLVE", "data": "", "summary_en": "400 procedural verifiable environments whose problem difficulty adapts to the policy's capability during RL.", "summary_zh": "400 个程序化可验证环境，题目难度在 RL 过程中随策略能力自适应调整。"}, {"name": "DreamGym", "title": "Scaling Agent Learning via Experience Synthesis", "arxiv": "2511.03773", "date": "2025-11", "domain": "Tool & API", "affiliations": ["Meta", "University of Chicago", "UNC Chapel Hill"], "code": "", "data": "", "summary_en": "Distills environment dynamics into a reasoning-based experience model that generates transitions and rewards, with adaptive task generation for RL.", "summary_zh": "把环境动力学蒸馏为基于推理的经验模型来生成状态转移与奖励，并自适应生成任务用于 RL。"}, {"name": "Simia", "title": "Simulating Environments with Reasoning Models for Agent Training", "arxiv": "2511.01824", "date": "2025-11", "domain": "Tool & API", "affiliations": ["University of Washington", "Microsoft", "CMU"], "code": "https://github.com/microsoft/Simia-Agent-Training", "data": "https://huggingface.co/Simia-Agent", "summary_en": "Reasoning LLMs simulate environment feedback from tool schemas without real APIs, amplifying SFT trajectories and serving as RL environments.", "summary_zh": "推理模型依据工具定义直接模拟环境反馈，无需真实 API，既扩增 SFT 轨迹又充当 RL 环境。"}, {"name": "BugPilot", "title": "BugPilot: Complex Bug Generation for Efficient Learning of SWE Skills", "arxiv": "2510.19898", "date": "2025-10", "domain": "SWE", "affiliations": ["Cornell University", "UC San Diego", "UNC Chapel Hill"], "code": "", "data": "", "summary_en": "SWE agents implement new features that unintentionally break tests, yielding realistic, complex and verifiable training bugs.", "summary_zh": "让 SWE Agent 开发新功能并无意间破坏测试，得到更真实、更复杂且可验证的训练 bug。"}, {"name": "UI-Simulator", "title": "LLMs as Scalable, General-Purpose Simulators For Evolving Digital Agent Training", "arxiv": "2510.14969", "date": "2025-10", "domain": "Web & GUI", "affiliations": ["Harvard University", "UCLA"], "code": "https://github.com/WadeYin9712/UI-Simulator", "data": "https://huggingface.co/UI-Simulator", "summary_en": "An LLM acts as a world simulator generating UI state transitions, forming virtual digital environments for trajectory collection.", "summary_zh": "让 LLM 充当世界模拟器生成 UI 状态转移，构成用于轨迹采集的虚拟数字环境。"}, {"name": "EmboMatrix", "title": "EmboMatrix: A Scalable Training-Ground for Embodied Decision-Making", "arxiv": "2510.12072", "date": "2025-10", "domain": "Game & Embodied", "affiliations": ["SJTU", "Zhongguancun Academy", "NYU"], "code": "", "data": "", "summary_en": "Multi-agent data engine generates embodied tasks and simulated scenes with multi-level rewards for LLM embodied RL.", "summary_zh": "多智能体数据引擎生成具身任务与仿真场景，配合多层级奖励进行 LLM 具身 RL。"}, {"name": "AgentScaler", "title": "Towards General Agentic Intelligence via Environment Scaling", "arxiv": "2509.13311", "date": "2025-09", "domain": "Tool & API", "affiliations": ["Alibaba"], "code": "", "data": "", "summary_en": "Automatically constructs fully simulated, heterogeneous function-calling environments and trains agents with a two-phase fine-tuning recipe.", "summary_zh": "自动构建完全模拟的异构函数调用环境，并以两阶段微调训练 Agent。"}, {"name": "SWE-Mirror", "title": "SWE-Mirror: Scaling Issue-Resolving Datasets by Mirroring Issues Across Repositories", "arxiv": "2509.08724", "date": "2025-09", "domain": "SWE", "affiliations": ["ByteDance", "CUHK"], "code": "", "data": "", "summary_en": "Distills real issues and re-instantiates them in repos that already have Gym environments, reusing environments to scale tasks.", "summary_zh": "提炼真实 issue 语义并移植到已有环境的仓库中，复用环境以扩充任务。"}, {"name": "InternBootcamp", "title": "InternBootcamp: Boosting LLM Reasoning with Verifiable Task Scaling", "arxiv": "2508.08636", "date": "2025-08", "domain": "Reasoning", "affiliations": ["Shanghai AI Laboratory", "Fudan University"], "code": "https://github.com/InternLM/InternBootcamp", "data": "", "summary_en": "Agent workflow auto-generates 1,000+ bootcamp environments, each with instance generator and verifier, for scalable verifiable-task RL.", "summary_zh": "Agent 工作流自动生成 1000 多个 Bootcamp 环境（含实例生成器与验证器），用于大规模可验证任务 RL。"}, {"name": "RepoForge", "title": "RepoForge: Training a SOTA Fast-thinking SWE Agent with an End-to-End Data Curation Pipeline Synergizing SFT and RL at Scale", "arxiv": "2508.01550", "date": "2025-08", "domain": "SWE", "affiliations": ["Huawei", "University of Waterloo", "Queen's University"], "code": "", "data": "", "summary_en": "Autonomously generates executable environments from GitHub commits with storage-efficient image pruning and distributed evaluation for RL.", "summary_zh": "从 GitHub commit 零人工生成可执行环境，配合镜像裁剪与分布式评测支撑 RL。"}, {"name": "WebSynthesis", "title": "WebSynthesis: World-Model-Guided MCTS for Efficient WebUI-Trajectory Synthesis", "arxiv": "2507.04370", "date": "2025-07", "domain": "Web & GUI", "affiliations": ["Beijing Jiaotong University"], "code": "https://github.com/LucusFigoGao/WebSynthesis", "data": "", "summary_en": "A learned web world model serves as a virtual environment; MCTS over it synthesizes WebUI trajectories without live websites.", "summary_zh": "以学习到的 Web 世界模型作为虚拟环境，在其上做 MCTS 合成 WebUI 轨迹，无需真实网站。"}, {"name": "Skywork-SWE", "title": "Skywork-SWE: Unveiling Data Scaling Laws for Software Engineering in LLMs", "arxiv": "2506.19290", "date": "2025-06", "domain": "SWE", "affiliations": ["Skywork AI"], "code": "", "data": "", "summary_en": "Incremental automated pipeline building per-instance runtime images with unit-test validation across thousands of Python repositories.", "summary_zh": "增量式自动流水线，为数千个 Python 仓库逐实例构建带单测验证的运行时镜像。"}, {"name": "SWE-Factory", "title": "SWE-Factory: Your Automated Factory for Issue Resolution Training Data and Evaluation Benchmarks", "arxiv": "2506.10954", "date": "2025-06", "domain": "SWE", "affiliations": ["Sun Yat-sen University", "Huawei"], "code": "https://github.com/DeepSoftwareAnalytics/swe-factory", "data": "", "summary_en": "Multi-agent builder generates Dockerfiles and eval scripts with an environment memory pool; exit-code grading automates fail-to-pass validation.", "summary_zh": "多智能体借助环境记忆池自动生成 Dockerfile 与评测脚本，以退出码判分自动完成 fail-to-pass 验证。"}, {"name": "SWE-Flow", "title": "SWE-Flow: Synthesizing Software Engineering Data in a Test-Driven Manner", "arxiv": "2506.09003", "date": "2025-06", "domain": "SWE", "affiliations": ["SIAT, CAS", "Alibaba", "Zhejiang University"], "code": "https://github.com/Hambaobao/SWE-Flow", "data": "", "summary_en": "Builds runtime dependency graphs from unit tests to derive incremental TDD steps, each with a partial codebase and verifiable tests.", "summary_zh": "由单元测试构建运行时依赖图，推导增量开发步骤，每步包含部分代码库与可验证测试。"}, {"name": "RandomWorld", "title": "Procedural Environment Generation for Tool-Use Agents", "arxiv": "2506.11045", "date": "2025-05", "domain": "Tool & API", "affiliations": ["Saarland University"], "code": "https://github.com/coli-saar/randomworld", "data": "", "summary_en": "Procedurally generates typed synthetic tools and composes non-linear tool-call DAGs into interactive environments for online RL and SFT.", "summary_zh": "基于类型体系程序化生成合成工具，并组合成非线性工具调用 DAG，构成用于在线 RL 与 SFT 的交互环境。"}, {"name": "Reasoning Gym", "title": "Reasoning Gym: Reasoning Environments for Reinforcement Learning with Verifiable Rewards", "arxiv": "2505.24760", "date": "2025-05", "domain": "Reasoning", "affiliations": ["Open-Thought", "Scale AI", "UCL"], "code": "https://github.com/open-thought/reasoning-gym", "data": "", "summary_en": "Library of 100+ procedural generators with verifiers over algebra, logic, games and graphs for unlimited, difficulty-controllable RLVR data.", "summary_zh": "100 多个带验证器的程序化生成器，覆盖代数、逻辑、游戏、图等，可无限生成难度可控的 RLVR 数据。"}, {"name": "SWE-rebench", "title": "SWE-rebench: An Automated Pipeline for Task Collection and Decontaminated Evaluation of Software Engineering Agents", "arxiv": "2505.20411", "date": "2025-05", "domain": "SWE", "affiliations": ["Nebius"], "code": "", "data": "https://huggingface.co/datasets/nebius/SWE-rebench", "summary_en": "Fully automated mining of GitHub PRs with LLM-generated install recipes and execution-based validation, yielding RL-ready SWE tasks.", "summary_zh": "全自动挖掘 GitHub PR，由 LLM 生成安装配置并经执行验证，产出可直接用于 RL 的 SWE 任务。"}, {"name": "Enigmata", "title": "Enigmata: Scaling Logical Reasoning in Large Language Models with Synthetic Verifiable Puzzles", "arxiv": "2505.19914", "date": "2025-05", "domain": "Reasoning", "affiliations": ["ByteDance", "Fudan University", "Tsinghua University"], "code": "https://github.com/BytedTsinghua-SIA/Enigmata", "data": "https://huggingface.co/datasets/BytedTsinghua-SIA/Enigmata-Data", "summary_en": "Puzzle suite pairing each task with an unlimited, difficulty-controllable generator and a rule-based verifier for multi-task RLVR.", "summary_zh": "每类谜题均配有可无限生成、难度可控的生成器与规则验证器，用于多任务 RLVR。"}, {"name": "SynLogic", "title": "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond", "arxiv": "2505.19641", "date": "2025-05", "domain": "Reasoning", "affiliations": ["HKUST", "MiniMax", "City University of Hong Kong"], "code": "https://github.com/MiniMax-AI/SynLogic", "data": "", "summary_en": "Synthesizes 35 logical reasoning task types with adjustable difficulty and rule-based verifiers, directly usable for RLVR.", "summary_zh": "合成 35 类难度可调、带规则验证器的逻辑推理任务，可直接用于 RLVR。"}, {"name": "KORGym", "title": "KORGym: A Dynamic Game Platform for LLM Reasoning Evaluation", "arxiv": "2505.14552", "date": "2025-05", "domain": "Reasoning", "affiliations": ["ByteDance", "M-A-P", "Beihang University"], "code": "https://github.com/multimodal-art-projection/KORGym", "data": "", "summary_en": "Gym-style platform of 50+ procedurally parameterized text and visual games supporting multi-turn interaction and RL.", "summary_zh": "Gym 风格平台，包含 50 多个参数化生成的文本/视觉游戏，支持多轮交互与 RL。"}, {"name": "SWE-smith", "title": "SWE-smith: Scaling Data for Software Engineering Agents", "arxiv": "2504.21798", "date": "2025-04", "domain": "SWE", "affiliations": ["Stanford University", "Princeton University", "Alibaba"], "code": "https://github.com/SWE-bench/SWE-smith", "data": "https://huggingface.co/datasets/SWE-bench/SWE-smith", "summary_en": "Builds one environment per repo, then synthesizes test-breaking bugs via LM rewrites, AST mutations, PR reversal and bug combination.", "summary_zh": "每个仓库只建一个环境，再通过 LM 改写、AST 变异、回退 PR 等方式合成使测试失败的 bug。"}, {"name": "SWE-Synth", "title": "SWE-Synth: Synthesizing Verifiable Bug-Fix Data to Enable Large Language Models in Resolving Real-World Bugs", "arxiv": "2504.14757", "date": "2025-04", "domain": "SWE", "affiliations": ["FPT Software AI Center", "Nanyang Technological University", "University of Texas at Dallas"], "code": "", "data": "", "summary_en": "LLM agents simulate debugging workflows to synthesize verifiable repository-level bug-fix pairs, tests and repair trajectories.", "summary_zh": "LLM Agent 模拟调试流程，合成可验证的仓库级 bug 修复对、测试用例与修复轨迹。"}, {"name": "R2E-Gym", "title": "R2E-Gym: Procedural Environments and Hybrid Verifiers for Scaling Open-Weights SWE Agents", "arxiv": "2504.07164", "date": "2025-04", "domain": "SWE", "affiliations": ["UC Berkeley", "Australian National University"], "code": "https://github.com/R2E-Gym/R2E-Gym", "data": "", "summary_en": "Curates executable environments directly from commits via test generation and issue back-translation, without relying on human-written issues.", "summary_zh": "通过测试生成与 issue 反向翻译，直接从 commit 程序化构建可执行环境，不依赖人工 issue。"}, {"name": "MirrorAPI", "title": "StableToolBench-MirrorAPI: Modeling Tool Environments as Mirrors of 7,000+ Real-World APIs", "arxiv": "2503.20527", "date": "2025-03", "domain": "Tool & API", "affiliations": ["Tsinghua University", "RayNeo", "Google"], "code": "", "data": "", "summary_en": "Fine-tunes LLMs on real request-response pairs to act as high-fidelity mirrors of real APIs for tool environments.", "summary_zh": "用真实请求-响应对微调 LLM，使其成为真实 API 的高保真镜像工具环境。"}, {"name": "Repo2Run", "title": "Repo2Run: Automated Building Executable Environment for Code Repository at Scale", "arxiv": "2502.13681", "date": "2025-02", "domain": "SWE", "affiliations": ["HIT (Shenzhen)", "ByteDance"], "code": "https://github.com/bytedance/Repo2Run", "data": "", "summary_en": "An LLM agent iteratively builds Docker images with rollback and unit-test checks, synthesizing runnable Dockerfiles for arbitrary repos.", "summary_zh": "LLM Agent 迭代构建 Docker 镜像（可回滚）并运行单测，为任意仓库合成可运行的 Dockerfile。"}, {"name": "SWE-Gym", "title": "Training Software Engineering Agents and Verifiers with SWE-Gym", "arxiv": "2412.21139", "date": "2024-12", "domain": "SWE", "affiliations": ["UC Berkeley", "UIUC", "CMU"], "code": "https://github.com/SWE-Gym/SWE-Gym", "data": "https://huggingface.co/SWE-Gym", "summary_en": "Pairs real GitHub issues with pre-installed executable runtimes and unit-test verification for training SWE agents and verifiers.", "summary_zh": "将真实 GitHub issue 与预装依赖的可执行运行时、单元测试验证结合，用于训练 SWE Agent 与验证器。"}, {"name": "AgentGen", "title": "AgentGen: Enhancing Planning Abilities for Large Language Model based Agent via Environment and Task Generation", "arxiv": "2408.00764", "date": "2024-08", "domain": "Game & Embodied", "affiliations": ["University of Hong Kong", "Microsoft"], "code": "", "data": "", "summary_en": "LLMs generate diverse PDDL/code environments from an inspiration corpus, then evolve tasks bidirectionally for controllable difficulty.", "summary_zh": "LLM 以灵感语料为种子生成多样的 PDDL/代码环境，再以双向演化生成难度可控的规划任务。"}]}, {"slug": "verifiable-rewards", "title_en": "Verifiable Rewards", "title_zh": "可验证奖励（Verifiable Rewards）", "desc_en_html": "Works that obtain rewards <strong>checkable by programs, rules or formal systems<\/strong>: verifiable task datasets (math, code, proofs, science, instruction constraints), methods to synthesize answers, test cases or checkers, and the design of verifiers themselves. Learned reward models and LLM judges are excluded.", "desc_zh_html": "收录奖励<strong>可由程序、规则或形式系统自动校验<\/strong>的工作：可验证任务数据集（数学、代码、证明、科学、指令约束），合成答案、测试用例或检查器的方法，以及验证器本身的设计。训练得到的奖励模型与 LLM 评判不在此列。", "entries": [{"name": "CaLIF", "title": "Diagnosing and Correcting Reward Hacking in Verifiable Instruction Following", "arxiv": "2610.19525", "date": "2026-10", "domain": "Instruction Following", "affiliations": ["Yonsei University", "FuriosaAI", "University of Washington"], "code": "", "data": "", "summary_en": "Shows constraint-checker rewards induce empty but compliant responses, and calibrates them with a reference-policy likelihood bonus.", "summary_zh": "指出约束检查奖励会诱导“满足约束但答非所问”的回复，并以参考策略似然加以校准。"}, {"name": "MagicBeanStalk", "title": "MagicBeanStalk: Escaping the RLVR Zero Advantage Trap with Recursive Data Synthesis", "arxiv": "2610.12659", "date": "2026-10", "domain": "Math", "affiliations": ["University of Washington", "CMU", "NVIDIA"], "code": "", "data": "", "summary_en": "Decomposes hard seeds top-down and recursively composes new verifiable problems bottom-up, calibrated to the policy's difficulty.", "summary_zh": "自顶向下拆解难题，再自底向上递归组合出新的可验证题，并按策略能力校准难度。"}, {"name": "MIFS", "title": "Towards Scalable RLVR: Multimodal Instruction Following Data Synthesis and Distillation", "arxiv": "2609.16059", "date": "2026-09", "domain": "Instruction Following", "affiliations": ["Harbin Institute of Technology", "Peking University"], "code": "", "data": "", "summary_en": "Synthesizes 90K multimodal constraint instructions, each mapped to executable checker code and filtered by RL learnability.", "summary_zh": "合成 9 万条多模态约束指令，每条约束对应可执行检查代码，并按 RL 可学性筛选。"}, {"name": "TCS", "title": "Two-Stage Reinforcement Learning for Sound and Adversarial Test Generation in Code LLMs", "arxiv": "2609.03955", "date": "2026-09", "domain": "Code", "affiliations": ["Nanyang Technological University", "Skywork AI"], "code": "", "data": "", "summary_en": "Two-stage RL trains a test generator first for tests consistent with references, then for counterexamples targeting solver failures.", "summary_zh": "两阶段 RL：先训练与参考解一致的测试生成，再针对求解器的失败模式生成反例。"}, {"name": "RobustTests", "title": "Robust Code RL via Faulty-Code-Driven Test case Synthesis and Dense Reward Shaping", "arxiv": "2608.24135", "date": "2026-08", "domain": "Code", "affiliations": ["Zhejiang University", "Ant Group"], "code": "", "data": "https://huggingface.co/datasets/sid6/RobustTests", "summary_en": "Near-correct faulty programs drive test synthesis, filtered by validator agents and clustering, to reduce false positives and negatives.", "summary_zh": "以近似正确的错误程序驱动测试合成，并经校验智能体与聚类过滤，降低假阳性与假阴性。"}, {"name": "MathForm", "title": "MathForm: Scaling Mathematical Autoformalization with Knowledge Retrieval and Verification-Guided Refinement", "arxiv": "2608.14221", "date": "2026-08", "domain": "Formal Proof", "affiliations": ["ModelBest", "Tsinghua University"], "code": "", "data": "", "summary_en": "Mathlib-retrieval-guided autoformalization refined by compiler diagnostics and semantic feedback builds ~367K verified Lean examples.", "summary_zh": "检索 Mathlib 引导自动形式化，并以编译诊断与语义反馈修正，构建约 36.7 万条已验证的 Lean 样本。"}, {"name": "OProver", "title": "OProver: A Unified Framework for Agentic Formal Theorem Proving", "arxiv": "2605.17283", "date": "2026-05", "domain": "Formal Proof", "affiliations": ["M-A-P", "Monolith", "Beihang University"], "code": "", "data": "", "summary_en": "An agentic proving loop with Lean feedback builds 1.77M statements and 6.86M compiler-verified proofs with repair trajectories.", "summary_zh": "借助 Lean 反馈的智能体证明循环，构建 177 万命题与 686 万条编译器验证的证明及修复轨迹。"}, {"name": "BioAlchemy", "title": "BioAlchemy: Distilling Biological Literature into Reasoning-Ready Reinforcement Learning Training Data", "arxiv": "2604.03506", "date": "2026-04", "domain": "Science", "affiliations": ["University of Chicago", "Argonne National Laboratory"], "code": "", "data": "", "summary_en": "Extracts 345K answer-verifiable questions from biology papers, aligned to the PubMed topic distribution, for RLVR.", "summary_zh": "从生物学论文中抽取 34.5 万道可验证题，并按 PubMed 主题分布对齐，用于 RLVR。"}, {"name": "Code-A1", "title": "Code-A1: Adversarial Evolving of Code LLM and Test LLM via Reinforcement Learning", "arxiv": "2603.15611", "date": "2026-03", "domain": "Code", "affiliations": ["Zhejiang University"], "code": "https://github.com/ZJU-REAL/Code-A1", "data": "", "summary_en": "A code LLM and a white-box test LLM with opposing rewards co-evolve, producing adversarial tests that rival human tests as RL rewards.", "summary_zh": "代码模型与白盒测试模型以相反奖励对抗进化，生成的对抗测试作为 RL 奖励可媲美人工测试。"}, {"name": "Dr. SCI", "title": "Improving Data and Reward Design for Scientific Reasoning in Large Language Models", "arxiv": "2602.08321", "date": "2026-02", "domain": "Science", "affiliations": ["Zhejiang University", "Westlake University", "Microsoft"], "code": "", "data": "", "summary_en": "Processes open science data into 1M STEM questions with explicit verifiable vs. open-ended splits and difficulty labels.", "summary_zh": "将开源科学数据处理为 100 万道 STEM 题，显式区分可验证与开放部分并标注难度。"}, {"name": "Golden Goose", "title": "Golden Goose: A Simple Trick to Synthesize Unlimited RLVR Tasks from Unverifiable Internet Text", "arxiv": "2601.22975", "date": "2026-01", "domain": "General Reasoning", "affiliations": ["NVIDIA", "University of Washington", "UC San Diego"], "code": "", "data": "https://huggingface.co/datasets/nvidia/Nemotron-Research-GooseReason-0.7M", "summary_en": "Masks key reasoning spans in unverifiable text and adds distractors, turning corpora into multiple-choice fill-in-the-middle tasks with exact-match rewards.", "summary_zh": "遮蔽不可验证文本中的关键推理片段并加入干扰项，把语料变为可精确匹配的中间填空选择题。"}, {"name": "PhysProver", "title": "PhysProver: Advancing Automatic Theorem Proving for Physics", "arxiv": "2601.15737", "date": "2026-01", "domain": "Formal Proof", "affiliations": ["UIUC", "Rutgers University"], "code": "", "data": "", "summary_en": "Builds physics Lean data from PhysLean theorems plus synthesized conjectures, then RLVR with Lean-verified proof rewards.", "summary_zh": "由 PhysLean 定理与合成猜想构建物理 Lean 数据，再以 Lean 验证的证明奖励做 RLVR。"}, {"name": "CodeContests-O", "title": "CodeContests-O: Powering LLMs via Feedback-Driven Iterative Test Case Generation", "arxiv": "2601.13682", "date": "2026-01", "domain": "Code", "affiliations": ["USTC"], "code": "https://github.com/cai-jianfeng/CodeContests-O", "data": "https://huggingface.co/datasets/caijanfeng/CodeContests-O", "summary_en": "Runs generated tests against known correct and incorrect solutions and feeds failures back to refine generators iteratively.", "summary_zh": "把生成的测试在已知正确与错误解上运行，并将失败反馈给 LLM 迭代改进生成器。"}, {"name": "X-Coder", "title": "X-Coder: Advancing Competitive Programming with Synthetic Tasks, Solutions, and Tests", "arxiv": "2601.06953", "date": "2026-01", "domain": "Code", "affiliations": ["Tsinghua University", "Microsoft"], "code": "https://github.com/JieWu02/X-Coder", "data": "https://huggingface.co/datasets/IIGroup/X-Coder-RL-40k", "summary_en": "Fully synthetic competitive tasks with tests cross-checked by dual verification of solutions and outputs, giving 40K RL tasks.", "summary_zh": "全合成竞赛题，测试经“解答+输出”双重验证，提供 4 万道 RL 任务。"}, {"name": "P1", "title": "P1: Mastering Physics Olympiads with Reinforcement Learning", "arxiv": "2511.13612", "date": "2025-11", "domain": "Science", "affiliations": ["Shanghai AI Laboratory"], "code": "https://github.com/PRIME-RL/P1", "data": "", "summary_en": "Curates Olympiad and textbook physics problems with rule-verifiable final answers (types, units) to train physics reasoners with RL.", "summary_zh": "整理奥赛与教材物理题并标注可规则校验的最终答案（类型、单位），以 RL 训练物理推理模型。"}, {"name": "Webscale-RL", "title": "Webscale-RL: Automated Data Pipeline for Scaling RL Data to Pretraining Levels", "arxiv": "2510.06499", "date": "2025-10", "domain": "General Reasoning", "affiliations": ["Salesforce", "CMU"], "code": "https://github.com/SalesforceAIResearch/PretrainRL-pipeline", "data": "", "summary_en": "Converts pretraining documents into 1.2M verifiable QA pairs across 9+ domains via filtering, persona-driven generation and checking.", "summary_zh": "经过滤、角色驱动生成与校验，把预训练文档转换为 120 万条跨 9+ 领域的可验证问答。"}, {"name": "Noisy-Verifier RLVR", "title": "Reinforcement Learning with Verifiable yet Noisy Rewards under Imperfect Verifiers", "arxiv": "2510.00915", "date": "2025-10", "domain": "Verifier", "affiliations": ["RIKEN AIP", "University of Tokyo", "University of Melbourne"], "code": "", "data": "", "summary_en": "Models verifier errors as an asymmetric false-positive/negative noise channel and corrects for it to recover clean policy gradients.", "summary_zh": "把验证器错误建模为不对称的假阳/假阴噪声通道，并加以校正以恢复干净的策略梯度。"}, {"name": "AutoCode", "title": "AutoCode: LLMs as Problem Setters for Competitive Programming", "arxiv": "2510.12803", "date": "2025-09", "domain": "Code", "affiliations": ["UC San Diego", "NYU", "University of Washington"], "code": "", "data": "", "summary_en": "A validator-generator-checker loop yields test suites about 99% consistent with official verdicts, designed as low-false-positive RLVR verifiers.", "summary_zh": "校验器-生成器-判题器闭环生成与官方判题约 99% 一致的测试集，作为低假阳性的 RLVR 验证器。"}, {"name": "PromptCoT 2.0", "title": "PromptCoT 2.0: Scaling Prompt Synthesis for Large Language Model Reasoning", "arxiv": "2509.19894", "date": "2025-09", "domain": "Math", "affiliations": ["University of Hong Kong", "Ant Group"], "code": "https://github.com/inclusionAI/PromptCoT", "data": "", "summary_en": "An EM loop refines rationales to synthesize harder math and code prompts for training with verifiable feedback.", "summary_zh": "以 EM 循环迭代优化推理依据，合成更难的数学与代码题，用于基于可验证反馈的训练。"}, {"name": "Loong", "title": "Loong: Synthesize Long Chain-of-Thoughts at Scale through Verifiers", "arxiv": "2509.03059", "date": "2025-09", "domain": "General Reasoning", "affiliations": ["CAMEL-AI.org"], "code": "https://github.com/camel-ai/loong", "data": "", "summary_en": "Human-vetted seeds with executable code across 12 domains; synthesized question-answer-code triples reward CoT matching the code-executed answer.", "summary_zh": "12 个领域、配可执行代码的人工审核种子；合成问题-答案-代码三元组，CoT 结果与代码执行答案一致即得奖励。"}, {"name": "UTRL", "title": "Learning to Generate Unit Test via Adversarial Reinforcement Learning", "arxiv": "2508.21107", "date": "2025-08", "domain": "Code", "affiliations": ["KAIST", "Microsoft"], "code": "https://github.com/dgjun32/UTRL", "data": "", "summary_en": "A test generator is rewarded for tests that pass gold code but fail generated code, trained adversarially against a coder.", "summary_zh": "测试生成器写出“标准代码通过、生成代码失败”的测试即得奖励，并与编码器对抗训练。"}, {"name": "FormaRL", "title": "FormaRL: Enhancing Autoformalization with no Labeled Data", "arxiv": "2508.18914", "date": "2025-08", "domain": "Formal Proof", "affiliations": ["Tsinghua University", "Tongji University", "Beijing Forestry University"], "code": "https://github.com/THUNLP-MT/FormaRL", "data": "", "summary_en": "RL for autoformalization with rewards from Lean syntax checks and consistency checks, using only a few hundred unlabeled problems.", "summary_zh": "面向自动形式化的 RL，奖励来自 Lean 语法检查与一致性检查，仅需数百道无标注题。"}, {"name": "OwkinZero", "title": "OwkinZero: Accelerating Biological Discovery with AI", "arxiv": "2508.16315", "date": "2025-08", "domain": "Science", "affiliations": ["Owkin"], "code": "", "data": "", "summary_en": "Curates 300K+ biology QA pairs whose labels come from deterministic pipelines such as expression tests and druggability scores.", "summary_zh": "整理 30 万余条生物问答，标签来自表达检验、成药性打分等确定性流程。"}, {"name": "Klear-CodeTest", "title": "Klear-CodeTest: Scalable Test Case Generation for Code Reinforcement Learning", "arxiv": "2508.05710", "date": "2025-08", "domain": "Code", "affiliations": ["Kuaishou"], "code": "https://github.com/Kwai-Klear/CodeTest", "data": "https://huggingface.co/datasets/Kwai-Klear/Klear-CodeTest", "summary_en": "A generator-validation framework produces regular and corner-case tests checked against multiple gold solutions, with a secure sandbox for rewards.", "summary_zh": "生成-校验框架产出常规与边界测试，并以多份标准解做一致性校验，配套安全沙箱计算奖励。"}, {"name": "MathSmith", "title": "MathSmith: Towards Extremely Hard Mathematical Reasoning by Forging Synthetic Problems with a Reinforced Policy", "arxiv": "2508.05592", "date": "2025-08", "domain": "Math", "affiliations": ["Tsinghua University", "CUHK", "SenseTime"], "code": "https://github.com/Jasaxion/MathSmith", "data": "", "summary_en": "An RL-trained generator forges hard problems from scratch, rewarded for structural validity, difficulty and answer consistency.", "summary_zh": "用 RL 训练的出题器从零合成难题，奖励兼顾结构有效性、难度与答案一致性。"}, {"name": "IFDecorator", "title": "IFDECORATOR: Wrapping Instruction Following Reinforcement Learning with Verifiable Rewards", "arxiv": "2508.04632", "date": "2025-08", "domain": "Instruction Following", "affiliations": ["Shanghai AI Laboratory", "Shanghai Innovation Institute", "Fudan University"], "code": "", "data": "", "summary_en": "A cooperative-adversarial flywheel co-evolves instructions and hybrid verifications; intent checks and trap instructions curb reward hacking.", "summary_zh": "协作-对抗数据飞轮让指令与混合校验共同进化，意图检查与陷阱指令抑制奖励投机。"}, {"name": "Goedel-Prover-V2", "title": "Goedel-Prover-V2: Scaling Formal Theorem Proving with Scaffolded Data Synthesis and Self-Correction", "arxiv": "2508.03613", "date": "2025-08", "domain": "Formal Proof", "affiliations": ["Princeton University", "NVIDIA", "Tsinghua University"], "code": "https://github.com/Goedel-LM/Goedel-Prover-V2", "data": "", "summary_en": "Scaffolded synthesis of progressively harder Lean tasks plus self-correction from Lean compiler feedback within expert iteration and RL.", "summary_zh": "渐进式合成难度递增的 Lean 任务，并在专家迭代与 RL 中利用 Lean 编译反馈自我修正。"}, {"name": "CoT-Self-Instruct", "title": "CoT-Self-Instruct: Building high-quality synthetic prompts for reasoning and non-reasoning tasks", "arxiv": "2507.23751", "date": "2025-07", "domain": "Math", "affiliations": ["Meta", "NYU"], "code": "", "data": "", "summary_en": "LLMs plan with CoT to write new single-answer problems, kept only if majority-vote answers are consistent, for RLVR.", "summary_zh": "LLM 先用 CoT 规划再生成单值答案的新题，经多数投票一致性过滤后用于 RLVR。"}, {"name": "SAGA", "title": "Rethinking Verification for LLM Code Generation: From Generation to Testing", "arxiv": "2507.06920", "date": "2025-07", "domain": "Code", "affiliations": ["Shanghai AI Laboratory", "Xi'an Jiaotong University"], "code": "https://github.com/open-compass/SAGA", "data": "https://huggingface.co/datasets/opencompass/CodeForce_SAGA", "summary_en": "Human-LLM test generation mines correct and incorrect human submissions to build discriminative test suites for more accurate RLVR rewards.", "summary_zh": "人机协同生成测试，分析人类正确与错误提交以构造区分力强的测试集，使 RLVR 奖励更准确。"}, {"name": "CriticLean", "title": "CriticLean: Critic-Guided Reinforcement Learning for Mathematical Formalization", "arxiv": "2507.06181", "date": "2025-07", "domain": "Formal Proof", "affiliations": ["ByteDance", "Nanjing University"], "code": "https://github.com/multimodal-art-projection/CriticLean", "data": "https://huggingface.co/datasets/m-a-p/FineLeanCorpus", "summary_en": "Lean compilation plus an RL-trained semantic critic refine autoformalizations, yielding 285K compile- and critic-verified statements.", "summary_zh": "Lean 编译检查加 RL 训练的语义评估器迭代修正自动形式化，得到 28.5 万条双重校验的命题。"}, {"name": "IFBench", "title": "Generalizing Verifiable Instruction Following", "arxiv": "2507.02833", "date": "2025-07", "domain": "Instruction Following", "affiliations": ["AI2", "University of Washington"], "code": "https://github.com/allenai/IFBench", "data": "https://huggingface.co/datasets/allenai/IF_multi_constraints_upto5", "summary_en": "Releases new training constraints with Python verification functions and IF-RLVR prompts; programmatic checks serve as RLVR rewards.", "summary_zh": "发布新的训练约束及 Python 校验函数和 IF-RLVR 训练集，以程序化约束检查作为 RLVR 奖励。"}, {"name": "ether0", "title": "Training a Scientific Reasoning Model for Chemistry", "arxiv": "2506.17238", "date": "2025-06", "domain": "Science", "affiliations": ["FutureHouse"], "code": "https://github.com/Future-House/ether0", "data": "https://huggingface.co/datasets/futurehouse/ether0-benchmark", "summary_en": "RL on 640K experimentally grounded chemistry problems with open-source programmatic reward functions that check molecules.", "summary_zh": "在 64 万道以实验为依据的化学题上做 RL，以开源的程序化奖励函数校验分子答案。"}, {"name": "Guru", "title": "Revisiting Reinforcement Learning for LLM Reasoning from A Cross-Domain Perspective", "arxiv": "2506.14965", "date": "2025-06", "domain": "General Reasoning", "affiliations": ["UC San Diego", "MBZUAI", "CMU"], "code": "https://github.com/LLM360/Reasoning360", "data": "https://huggingface.co/datasets/LLM360/guru-RL-92k", "summary_en": "92K verifiable examples across math, code, science, logic, simulation and tables, each domain with its own reward design and filtering.", "summary_zh": "覆盖数学、代码、科学、逻辑、模拟、表格 6 个领域的 9.2 万条可验证样本，各领域单独设计奖励与过滤。"}, {"name": "VerIF", "title": "VerIF: Verification Engineering for Reinforcement Learning in Instruction Following", "arxiv": "2506.09942", "date": "2025-06", "domain": "Instruction Following", "affiliations": ["Tsinghua University"], "code": "https://github.com/THU-KEG/VerIF", "data": "https://huggingface.co/datasets/THU-KEG/VerInstruct", "summary_en": "Hybrid rewards: code checks for hard constraints plus reasoning-LLM checks for soft ones; releases ~22K instructions with verification signals.", "summary_zh": "混合奖励：硬约束用代码校验、软约束用推理模型校验；发布约 2.2 万条带校验信号的指令。"}, {"name": "SwS", "title": "SwS: Self-aware Weakness-driven Problem Synthesis in Reinforcement Learning for LLM Reasoning", "arxiv": "2506.08989", "date": "2025-06", "domain": "Math", "affiliations": ["UCLA", "UCAS", "Microsoft"], "code": "https://github.com/MasterVito/SwS", "data": "", "summary_en": "Synthesizes new verifiable problems from concepts behind questions the policy keeps failing during RL.", "summary_zh": "提取策略在 RL 中反复失败题目背后的概念，合成新的可验证题。"}, {"name": "CodeContests+", "title": "CodeContests+: High-Quality Test Case Generation for Competitive Programming", "arxiv": "2506.05817", "date": "2025-06", "domain": "Code", "affiliations": ["ByteDance", "Peking University"], "code": "", "data": "https://huggingface.co/datasets/ByteDance-Seed/Code-Contests-Plus", "summary_en": "An LLM agent writes generators, validators and checkers for 11.7K problems, measured against 1.72M real submissions.", "summary_zh": "LLM 智能体为 1.17 万道竞赛题编写生成器、校验器与判题器，并用 172 万份真实提交评估质量。"}, {"name": "CURE", "title": "Co-Evolving LLM Coder and Unit Tester via Reinforcement Learning", "arxiv": "2506.03136", "date": "2025-06", "domain": "Code", "affiliations": ["University of Chicago", "Princeton University", "Peking University"], "code": "https://github.com/Gen-Verse/CURE", "data": "", "summary_en": "Coder and unit tester co-evolve via RL from their interaction outcomes without ground-truth code; the tester then supplies rewards.", "summary_zh": "编码器与单测生成器依据彼此交互结果经 RL 共同进化，无需标准代码，训练出的测试器可提供奖励。"}, {"name": "RAIF", "title": "Incentivizing Reasoning for Advanced Instruction-Following of Large Language Models", "arxiv": "2506.01413", "date": "2025-06", "domain": "Instruction Following", "affiliations": ["Tencent", "Xiamen University", "CUHK"], "code": "https://github.com/yuleiqin/RAIF", "data": "", "summary_en": "Decomposes complex compositional instructions into data with rule-centric verifiable rewards, using RL to cultivate reasoning for instruction following.", "summary_zh": "把复杂组合指令分解为配有规则型可验证奖励的数据，用 RL 培养指令遵循中的推理。"}, {"name": "HardTests", "title": "HardTests: Synthesizing High-Quality Test Cases for LLM Coding", "arxiv": "2505.24098", "date": "2025-05", "domain": "Code", "affiliations": ["CMU", "UC Santa Barbara", "UT Austin"], "code": "https://github.com/LeiLiLab/HardTestGen", "data": "https://huggingface.co/datasets/sigcp/hardtests_problems", "summary_en": "LLM-written input validators, generators and hacking inputs with oracle outputs build 47K problems with stronger tests.", "summary_zh": "由 LLM 编写输入校验器、生成器与针对性输入，并以标准程序给出输出，构建 4.7 万道强测试题。"}, {"name": "DeepTheorem", "title": "DeepTheorem: Advancing LLM Reasoning for Theorem Proving Through Natural Language and Reinforcement Learning", "arxiv": "2505.23754", "date": "2025-05", "domain": "Math", "affiliations": ["Tencent", "SJTU"], "code": "https://github.com/Jiahao004/DeepTheorem", "data": "https://huggingface.co/datasets/Jiahao004/DeepTheorem", "summary_en": "Builds true/false variants of 121K informal theorems so that proving yields a checkable truth-value reward.", "summary_zh": "为 12.1 万条非形式定理构造真/假变体，使“证明”转化为可校验的真值奖励。"}, {"name": "Rule-vs-Model Verifiers", "title": "From Accuracy to Robustness: A Study of Rule- and Model-based Verifiers in Mathematical Reasoning", "arxiv": "2505.22203", "date": "2025-05", "domain": "Verifier", "affiliations": ["HKUST", "CUHK", "Tsinghua University"], "code": "", "data": "", "summary_en": "Rule-based verifiers miss equivalent answers, while model-based verifiers get hacked during RL; analyzes both failure modes.", "summary_zh": "规则验证器认不出等价答案（假阴性），模型验证器在 RL 中被钻空子（假阳性），系统分析两类失效。"}, {"name": "rStar-Coder", "title": "rStar-Coder: Scaling Competitive Code Reasoning with a Large-Scale Verified Dataset", "arxiv": "2505.21297", "date": "2025-05", "domain": "Code", "affiliations": ["Microsoft", "Dalian University of Technology", "SJTU"], "code": "https://github.com/microsoft/rStar", "data": "https://huggingface.co/datasets/microsoft/rStar-Coder", "summary_en": "Three-step input generation plus mutual verification across solutions labels outputs, yielding 418K competition problems with verified tests.", "summary_zh": "三步式输入生成加多解互验标注输出，构建 41.8 万道带验证测试的竞赛题。"}, {"name": "RECAST", "title": "RECAST: Expanding the Boundaries of LLMs' Complex Instruction Following with Multi-Constraint Data", "arxiv": "2505.19030", "date": "2025-05", "domain": "Instruction Following", "affiliations": ["Fudan University", "Xiaohongshu"], "code": "https://github.com/Thekey756/RECAST", "data": "https://huggingface.co/datasets/zk-guo/RECAST-30K", "summary_en": "Mines constraints from real prompt-response pairs into 30K instances; rule and LLM validators give per-constraint RL rewards.", "summary_zh": "从真实指令-回复对中挖掘约束，构造 3 万条多约束数据，规则与 LLM 校验器逐条约束给出 RL 奖励。"}, {"name": "Synthetic Data RL", "title": "Synthetic Data RL: Task Definition Is All You Need", "arxiv": "2505.17063", "date": "2025-05", "domain": "General Reasoning", "affiliations": ["Peking University", "MIT", "UIUC"], "code": "https://github.com/gydpku/Data_Synthesis_RL", "data": "", "summary_en": "Generates verifiable QA pairs from only a task definition and retrieved passages, adapting difficulty and selecting by pass rate before RL.", "summary_zh": "仅凭任务定义与检索段落生成可验证问答，调整难度并按通过率筛选后用于 RL。"}, {"name": "General-Reasoner", "title": "General-Reasoner: Advancing LLM Reasoning Across All Domains", "arxiv": "2505.14652", "date": "2025-05", "domain": "General Reasoning", "affiliations": ["University of Waterloo", "ByteDance", "Vector Institute"], "code": "https://github.com/TIGER-AI-Lab/General-Reasoner", "data": "https://huggingface.co/datasets/TIGER-Lab/WebInstruct-verified", "summary_en": "Re-crawls web sources to recover human answers, keeping 230K cross-domain questions with short verifiable answers.", "summary_zh": "回溯网页取回人工答案，保留 23 万道跨学科、短答案可验证的题目。"}, {"name": "TinyV", "title": "TinyV: Reducing False Negatives in Verification Improves RL for LLM Reasoning", "arxiv": "2505.14625", "date": "2025-05", "domain": "Verifier", "affiliations": ["University of Washington", "Western Washington University"], "code": "https://github.com/uw-nsl/TinyV", "data": "", "summary_en": "Finds many verifier false negatives in RL; a small model re-checks rule-rejected answers to recover correct rewards.", "summary_zh": "发现 RL 中规则验证器存在大量假阴性，用小模型复核被规则判错的答案以找回正确奖励。"}, {"name": "SHARP", "title": "SHARP: Synthesizing High-quality Aligned Reasoning Problems for Large Reasoning Models Reinforcement Learning", "arxiv": "2505.14147", "date": "2025-05", "domain": "Science", "affiliations": ["Ant Group"], "code": "", "data": "", "summary_en": "A strong reasoning model synthesizes graduate/Olympiad STEM problems constrained to unique numeric or symbolic answers for binary rewards.", "summary_zh": "由强推理模型合成研究生/奥赛级 STEM 题，并约束答案为唯一数值或符号，以获得二值奖励。"}, {"name": "MulDimIF", "title": "MulDimIF: A Multi-Dimensional Constraint Framework for Evaluating and Improving Instruction Following in Large Language Models", "arxiv": "2505.07591", "date": "2025-05", "domain": "Instruction Following", "affiliations": ["Fudan University", "Lenovo", "Tencent"], "code": "https://github.com/Junjie-Ye/MulDimIF", "data": "https://huggingface.co/datasets/Junjie-Ye/MulDimIF", "summary_en": "A controllable pipeline of constraint expansion, conflict detection and rewriting builds code-verifiable samples whose scripts serve as GRPO rewards.", "summary_zh": "通过约束扩展、冲突检测与改写可控生成可代码校验的样本，校验脚本直接作为 GRPO 奖励。"}, {"name": "DeepSeek-Prover-V2", "title": "DeepSeek-Prover-V2: Advancing Formal Mathematical Reasoning via Reinforcement Learning for Subgoal Decomposition", "arxiv": "2504.21801", "date": "2025-04", "domain": "Formal Proof", "affiliations": ["DeepSeek"], "code": "https://github.com/deepseek-ai/DeepSeek-Prover-V2", "data": "", "summary_en": "Decomposes theorems into Lean subgoals; Lean-verified subgoal proofs form cold-start data, followed by RL with binary verification rewards.", "summary_zh": "把定理分解为 Lean 子目标，经 Lean 校验的子目标证明拼合为冷启动数据，再以二值校验奖励做 RL。"}, {"name": "RV-Syn", "title": "RV-Syn: Rational and Verifiable Mathematical Reasoning Data Synthesis based on Structured Function Library", "arxiv": "2504.20426", "date": "2025-04", "domain": "Math", "affiliations": ["Renmin University of China", "Ant Group"], "code": "", "data": "", "summary_en": "Composes library functions into executable computation graphs and back-translates them into problems whose answers come from execution.", "summary_zh": "把函数库组合成可执行计算图并反译成题目，执行计算图即得真值答案。"}, {"name": "LeetCodeDataset", "title": "LeetCodeDataset: A Temporal Dataset for Robust Evaluation and Efficient Training of Code LLMs", "arxiv": "2504.14655", "date": "2025-04", "domain": "Code", "affiliations": [], "code": "https://github.com/newfacade/LeetCodeDataset", "data": "https://huggingface.co/datasets/newfacade/LeetCodeDataset", "summary_en": "LeetCode Python problems with verified canonical solutions and 100+ tests each, plus a temporal split for contamination-free training.", "summary_zh": "LeetCode Python 题，每题配经验证的标准解与 100+ 测试，并按时间切分以避免污染。"}, {"name": "Nemotron-CrossThink", "title": "Nemotron-CrossThink: Scaling Self-Learning beyond Math Reasoning", "arxiv": "2504.13941", "date": "2025-04", "domain": "General Reasoning", "affiliations": ["CMU", "NVIDIA", "Boston University"], "code": "", "data": "https://huggingface.co/datasets/nvidia/Nemotron-CrossThink", "summary_en": "Templates multi-domain QA into multiple-choice or short open answers and filters for verifiability, enabling rule-based rewards beyond math.", "summary_zh": "把多领域问答套成选择题或短答题并过滤可验证性，使数学之外也能使用规则奖励。"}, {"name": "DeepMath-103K", "title": "DeepMath-103K: A Large-Scale, Challenging, Decontaminated, and Verifiable Mathematical Dataset for Advancing Reasoning", "arxiv": "2504.11456", "date": "2025-04", "domain": "Math", "affiliations": ["Tencent", "SJTU"], "code": "https://github.com/zwhe99/DeepMath", "data": "https://huggingface.co/datasets/zwhe99/DeepMath-103K", "summary_en": "103K hard, decontaminated math problems, each with a verifiable final answer for rule-based RL rewards.", "summary_zh": "10.3 万道高难度、去污染的数学题，每题带可规则校验的最终答案。"}, {"name": "Kimina-Prover", "title": "Kimina-Prover Preview: Towards Large Formal Reasoning Models with Reinforcement Learning", "arxiv": "2504.11354", "date": "2025-04", "domain": "Formal Proof", "affiliations": ["Numina", "Moonshot AI"], "code": "https://github.com/MoonshotAI/Kimina-Prover-Preview", "data": "https://huggingface.co/datasets/AI-MO/NuminaMath-LEAN", "summary_en": "Autoformalized and human-annotated Lean statements form the RL prompt set; a Lean server returns binary proof-correctness rewards.", "summary_zh": "自动形式化与人工标注的 Lean 命题构成 RL 题池，由 Lean 服务返回证明正误的二值奖励。"}, {"name": "Leanabell-Prover", "title": "Leanabell-Prover: Posttraining Scaling in Formal Reasoning", "arxiv": "2504.06122", "date": "2025-04", "domain": "Formal Proof", "affiliations": ["Kuaishou"], "code": "https://github.com/Leanabell-LM/Leanabell-Prover", "data": "https://huggingface.co/datasets/stoney0062/Leanabell-Prover-Formal-Statement", "summary_en": "Continual training on statement-proof pairs followed by RL with Lean 4 compiler outcome rewards; releases 140K formal statements.", "summary_zh": "先在命题-证明对上继续训练，再以 Lean 4 编译器结果奖励做 RL，公开 14 万条形式命题。"}, {"name": "KodCode", "title": "KodCode: A Diverse, Challenging, and Verifiable Synthetic Dataset for Coding", "arxiv": "2503.02951", "date": "2025-03", "domain": "Code", "affiliations": ["University of Washington", "Microsoft", "UT Austin"], "code": "https://github.com/KodCode-AI/kodcode", "data": "https://huggingface.co/datasets/KodCode/KodCode-V1", "summary_en": "Synthesizes 447K question-solution-unit-test triplets self-verified by execution, providing unit tests ready for RL rewards.", "summary_zh": "合成 44.7 万组经执行自验证的“题目-解答-单元测试”三元组，单测可直接作为 RL 奖励。"}, {"name": "Med-RLVR", "title": "Med-RLVR: Emerging Medical Reasoning from a 3B base model via reinforcement Learning", "arxiv": "2502.19655", "date": "2025-02", "domain": "Science", "affiliations": ["Microsoft"], "code": "", "data": "", "summary_en": "Uses gold labels of medical multiple-choice QA as rule-checkable rewards to elicit medical reasoning via RLVR.", "summary_zh": "以医学多选题的标准答案作为可规则校验的奖励，通过 RLVR 激发医学推理。"}, {"name": "Big-Math", "title": "Big-Math: A Large-Scale, High-Quality Math Dataset for Reinforcement Learning in Language Models", "arxiv": "2502.17387", "date": "2025-02", "domain": "Math", "affiliations": ["SynthLabs", "Stanford University"], "code": "https://github.com/SynthLabsAI/big-math", "data": "https://huggingface.co/datasets/SynthLabsAI/Big-Math-RL-Verified", "summary_en": "Filters 251K problems with unique closed-form answers and rewrites multiple-choice questions into open-ended, answer-verifiable form for RL.", "summary_zh": "筛出约 25 万道答案唯一、可闭式校验的数学题，并把选择题改写为可验证的开放题，用于 RL。"}, {"name": "Goedel-Prover", "title": "Goedel-Prover: A Frontier Model for Open-Source Automated Theorem Proving", "arxiv": "2502.07640", "date": "2025-02", "domain": "Formal Proof", "affiliations": ["Princeton University", "Tsinghua University", "Amazon"], "code": "https://github.com/Goedel-LM/Goedel-Prover", "data": "https://huggingface.co/datasets/Goedel-LM/Goedel-Pset-v1", "summary_en": "Autoformalizes 1.64M Lean statements and accumulates 800K+ Lean-verified proofs through iterative expert iteration.", "summary_zh": "自动形式化 164 万条 Lean 命题，并通过多轮专家迭代累积 80 万余条经 Lean 验证的证明。"}, {"name": "AceCoder", "title": "ACECODER: Acing Coder RL via Automated Test-Case Synthesis", "arxiv": "2502.01718", "date": "2025-02", "domain": "Code", "affiliations": ["University of Waterloo", "HKUST", "Netmind.AI"], "code": "https://github.com/TIGER-AI-Lab/AceCoder", "data": "https://huggingface.co/datasets/TIGER-Lab/AceCode-87K", "summary_en": "LLM-synthesized test cases filtered by execution turn seed questions into 87K verifiable problems; pass rates serve as RL rewards.", "summary_zh": "由 LLM 合成测试用例并经执行过滤，得到 8.7 万道可验证题，通过率直接作为 RL 奖励。"}, {"name": "STP", "title": "STP: Self-play LLM Theorem Provers with Iterative Conjecturing and Proving", "arxiv": "2502.00212", "date": "2025-01", "domain": "Formal Proof", "affiliations": ["Stanford University"], "code": "https://github.com/kfdong/STP", "data": "https://huggingface.co/datasets/kfdong/STP_Lean_0320", "summary_en": "A conjecturer proposes barely provable conjectures and a prover attempts them; formal verification rewards both, densifying sparse signals.", "summary_zh": "猜想者提出“刚好可证”的猜想，证明者尝试证明，形式化校验同时奖励两者，缓解奖励稀疏。"}, {"name": "Alchemy", "title": "Alchemy: Amplifying Theorem-Proving Capability through Symbolic Mutation", "arxiv": "2410.15748", "date": "2024-10", "domain": "Formal Proof", "affiliations": ["Xi'an Jiaotong University", "Microsoft"], "code": "", "data": "", "summary_en": "Symbolically mutates Mathlib theorems via rewrite/apply with invocable lemmas, expanding 110K to 6M Lean-checked theorems.", "summary_zh": "借助可调用引理对 Mathlib 定理做符号变异，把 11 万条扩充为 600 万条经 Lean 校验的定理。"}, {"name": "InternLM2.5-StepProver", "title": "InternLM2.5-StepProver: Advancing Automated Theorem Proving via Critic-Guided Search", "arxiv": "2410.15700", "date": "2024-10", "domain": "Formal Proof", "affiliations": ["Shanghai AI Laboratory", "CUHK", "Tsinghua University"], "code": "https://github.com/InternLM/InternLM-Math", "data": "", "summary_en": "Large-scale expert iteration on Lean Workbook; Lean-verified searched proofs retrain the prover and critic and are released.", "summary_zh": "在 Lean Workbook 上进行大规模专家迭代，以经 Lean 验证的搜索证明重训证明器与评估器，并公开证明。"}, {"name": "Herald", "title": "Herald: A Natural Language Annotated Lean 4 Dataset", "arxiv": "2410.10878", "date": "2024-10", "domain": "Formal Proof", "affiliations": ["Peking University", "National University of Singapore"], "code": "https://github.com/frenzymath/herald_translator", "data": "https://huggingface.co/datasets/FrenzyMath/Herald_statements", "summary_en": "Back-translates Mathlib4 into ~580K aligned NL-Lean pairs; the translator is checked by Lean compilation plus back-translation.", "summary_zh": "将 Mathlib4 回译为约 58 万条对齐的自然语言-Lean 对，翻译器经 Lean 编译与回译校验。"}, {"name": "DeepSeek-Prover-V1.5", "title": "DeepSeek-Prover-V1.5: Harnessing Proof Assistant Feedback for Reinforcement Learning and Monte-Carlo Tree Search", "arxiv": "2408.08152", "date": "2024-08", "domain": "Formal Proof", "affiliations": ["DeepSeek"], "code": "https://github.com/deepseek-ai/DeepSeek-Prover-V1.5", "data": "", "summary_en": "Uses Lean 4 compiler pass/fail on generated proofs as the RL reward (RLPAF), combined with exploration-driven tree search.", "summary_zh": "以 Lean 4 编译器对证明的通过/失败作为 RL 奖励（RLPAF），并结合探索驱动的树搜索。"}, {"name": "LEAN-GitHub", "title": "LEAN-GitHub: Compiling GitHub LEAN repositories for a versatile LEAN prover", "arxiv": "2407.17227", "date": "2024-07", "domain": "Formal Proof", "affiliations": ["Shanghai AI Laboratory", "CUHK"], "code": "https://github.com/InternLM/InternLM-Math", "data": "https://huggingface.co/datasets/internlm/Lean-Github", "summary_en": "Compiles nearly all Lean 4 GitHub repositories to extract compiler-checked tactic states and steps as verified training data.", "summary_zh": "编译几乎全部 GitHub 上的 Lean 4 仓库，抽取经编译器确认的策略状态与步骤作为已验证训练数据。"}, {"name": "AutoIF", "title": "Self-play with Execution Feedback: Improving Instruction-following Capabilities of Large Language Models", "arxiv": "2406.13542", "date": "2024-06", "domain": "Instruction Following", "affiliations": ["Alibaba"], "code": "https://github.com/QwenLM/AutoIF", "data": "", "summary_en": "LLMs self-generate instructions, Python verification functions and unit tests; execution feedback filters responses into training signals.", "summary_zh": "LLM 自行生成指令、Python 校验函数与单元测试，以执行反馈筛选回复，得到指令遵循训练信号。"}, {"name": "Lean Workbook", "title": "Lean Workbook: A large-scale Lean problem set formalized from natural language math problems", "arxiv": "2406.03847", "date": "2024-06", "domain": "Formal Proof", "affiliations": ["Shanghai AI Laboratory", "Tsinghua University", "SJTU"], "code": "https://github.com/InternLM/InternLM-Math", "data": "https://huggingface.co/datasets/internlm/Lean-Workbook", "summary_en": "Iterative autoformalization with Lean compile filtering and back-translation checks yields ~57K formal-informal problem pairs.", "summary_zh": "以 Lean 编译过滤与回译校验迭代自动形式化，得到约 5.7 万条形式/非形式题对。"}, {"name": "DeepSeek-Prover", "title": "DeepSeek-Prover: Advancing Theorem Proving in LLMs through Large-Scale Synthetic Data", "arxiv": "2405.14333", "date": "2024-05", "domain": "Formal Proof", "affiliations": ["DeepSeek", "Sun Yat-sen University", "University of Edinburgh"], "code": "", "data": "https://huggingface.co/datasets/deepseek-ai/DeepSeek-Prover-V1", "summary_en": "Autoformalizes competition problems into Lean 4 and keeps only Lean-verified proofs, yielding 8M verified statement-proof pairs.", "summary_zh": "把竞赛题自动形式化为 Lean 4，仅保留经 Lean 校验的证明，得到约 800 万条已验证的命题-证明对。"}, {"name": "TACO", "title": "TACO: Topics in Algorithmic COde generation dataset", "arxiv": "2312.14852", "date": "2023-12", "domain": "Code", "affiliations": ["BAAI", "Shandong Normal University", "Peking University"], "code": "https://github.com/FlagOpen/TACO", "data": "https://huggingface.co/datasets/BAAI/TACO", "summary_en": "26K algorithmic problems with I/O test cases, a widely reused execution-verifiable source for code RL.", "summary_zh": "2.6 万道带输入输出测试的算法题，是代码 RL 中被广泛复用的可执行验证数据源。"}]}]}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const COLORS = { "Tool & API": "#2563eb", "SWE": "#16a34a", "Terminal": "#64748b",
                   "Web & GUI": "#9333ea", "Game & Embodied": "#ea580c", "Reasoning": "#db2777",
                   "Math": "#0891b2", "Science": "#65a30d", "General Reasoning": "#c026d3", "Code": "#15803d",
                   "Formal Proof": "#b45309", "Instruction Following": "#4f46e5", "Verifier": "#dc2626" };
  const saved = localStorage.getItem("lang");
  const state = {
    lang: saved || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en"),
    q: "",
    domain: "all",
  };
  const all = D.modules.flatMap(m => m.entries);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const domainLabel = d => state.lang === "zh" ? D.domain_zh[d] : d;
  const haystack = e => [e.name, e.title, e.domain, D.domain_zh[e.domain], e.affiliations.join(" "),
                         e.summary_en, e.summary_zh].join(" ").toLowerCase();

  function matches(e) {
    if (state.domain !== "all" && e.domain !== state.domain) return false;
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const h = haystack(e);
    return terms.every(t => h.includes(t));
  }

  function card(e) {
    const t = D.i18n[state.lang];
    const links = [`<a class="pill" href="https://arxiv.org/abs/${esc(e.arxiv)}" target="_blank" rel="noopener">arXiv</a>`];
    if (e.code) links.push(`<a class="pill" href="${esc(e.code)}" target="_blank" rel="noopener">Code</a>`);
    if (e.data) links.push(`<a class="pill" href="${esc(e.data)}" target="_blank" rel="noopener">Data</a>`);
    const aff = e.affiliations.length ? e.affiliations.map(esc).join(" · ") : "-";
    return `<article class="card">
      <div class="meta"><span class="tag" style="--c:${COLORS[e.domain] || "#57606a"}">${esc(domainLabel(e.domain))}</span><span>${esc(e.date)}</span></div>
      <h3><a href="https://arxiv.org/abs/${esc(e.arxiv)}" target="_blank" rel="noopener">${esc(e.name)}</a></h3>
      <p class="ptitle">${esc(e.title)}</p>
      <p class="aff" title="${esc(t.aff)}">${aff}</p>
      <p class="sum">${esc(e["summary_" + state.lang])}</p>
      <div class="links">${links.join("")}</div>
    </article>`;
  }

  function render() {
    const t = D.i18n[state.lang];
    document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    document.getElementById("lang-btn").textContent = state.lang === "zh" ? "English" : "中文";
    document.getElementById("tagline").textContent = t.tagline;
    document.getElementById("intro").innerHTML = t.intro_html;
    document.getElementById("footer").innerHTML = t.footer_html;
    const search = document.getElementById("search");
    search.placeholder = t.search;
    if (search.value !== state.q) search.value = state.q;

    document.getElementById("toc").innerHTML = D.modules
      .map(m => `<a href="#${esc(m.slug)}">${esc(m["title_" + state.lang])}</a>`).join("");

    const counts = {};
    all.forEach(e => { counts[e.domain] = (counts[e.domain] || 0) + 1; });
    const domains = Object.keys(D.domain_zh).filter(d => counts[d]);
    document.getElementById("chips").innerHTML =
      `<button type="button" class="chip ${state.domain === "all" ? "on" : ""}" data-d="all">${esc(t.all)}<span class="n">${all.length}</span></button>` +
      domains.map(d => `<button type="button" class="chip ${state.domain === d ? "on" : ""}" data-d="${esc(d)}">${esc(domainLabel(d))}<span class="n">${counts[d]}</span></button>`).join("");

    let shown = 0;
    document.getElementById("main").innerHTML = D.modules.map(m => {
      const list = m.entries.filter(matches);
      shown += list.length;
      return `<section id="${esc(m.slug)}">
        <h2>${esc(m["title_" + state.lang])}</h2>
        <p class="desc">${m["desc_" + state.lang + "_html"]}</p>
        ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">${esc(t.none)}</p>`}
      </section>`;
    }).join("");
    document.getElementById("count").textContent = t.showing.replace("{n}", shown).replace("{m}", all.length);
  }

  document.getElementById("lang-btn").addEventListener("click", () => {
    state.lang = state.lang === "zh" ? "en" : "zh";
    localStorage.setItem("lang", state.lang);
    render();
  });
  document.getElementById("search").addEventListener("input", ev => { state.q = ev.target.value; render(); });
  document.getElementById("chips").addEventListener("click", ev => {
    const b = ev.target.closest(".chip");
    if (!b) return;
    state.domain = b.dataset.d;
    render();
  });
  render();
})();
</script>
</body>
</html>
