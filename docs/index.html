omatically or semi-automatically synthesize interactive, verifiable environments<\/strong> (state, tools/actions, tasks, rewards/verifiers) for agent RL or trajectory collection. Hand-built static benchmarks are excluded.", "desc_zh_html": "收录<strong>自动或半自动合成可交互、可验证环境<\/strong>（状态、工具/动作空间、任务、奖励/验证器）的工作，环境用于 Agent 强化学习或轨迹采集。纯人工搭建的静态评测集不收录。", "entries": [{"name": "MAI-Gym", "title": "MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments", "arxiv": "2610.20939", "date": "2026-10", "domain": "Web & GUI", "affiliations": ["Alibaba"], "code": "https://github.com/Tongyi-MAI/MAI-Gym", "data": "", "summary_en": "Synthesizes mocked mobile and desktop apps with state-checkable tasks via a diagnose-then-synthesize loop targeting agent weaknesses.", "summary_zh": "以“诊断后合成”循环针对 Agent 弱点合成带状态检查任务的模拟移动端与桌面 App。"}, {"name": "CompoWorld", "title": "CompoWorld: Compositional Environment Scaling for General Agents", "arxiv": "2609.33665", "date": "2026-09", "domain": "Tool & API", "affiliations": ["AllSpark Team"], "code": "", "data": "", "summary_en": "Coding agents implement MCP tool specs as typed, verified services, and random walks compose cross-service verifiable tasks.", "summary_zh": "编码 Agent 将 MCP 工具规范实现为带类型状态、经验证的服务，再通过随机游走组合跨服务的可验证任务。"}, {"name": "Envs-FORGE", "title": "Envs-FORGE: Frontier-Optimized Reward-Grounded Environment Synthesis for Agent RL", "arxiv": "2608.14312", "date": "2026-08", "domain": "Terminal", "affiliations": ["IDEA Research", "HKUST (Guangzhou)", "DataArcTech"], "code": "https://github.com/DataArcTech/DataArc-SynData-Toolkit", "data": "", "summary_en": "Turns verifier pass rates into MILP-selected synthesis actions that rewrite instructions, tests and Docker environments toward the learning frontier.", "summary_zh": "将验证通过率转化为 MILP 选择的合成动作，改写指令、测试与 Docker 环境，使难度贴近学习前沿。"}, {"name": "Echoverse", "title": "Echoverse: Deep, Evolving Environments for Training Computer-Use Agents at Scale", "arxiv": "2607.28074", "date": "2026-07", "domain": "Web & GUI", "affiliations": ["Microsoft"], "code": "", "data": "", "summary_en": "Agent-built deep, stateful computer-use environments that keep evolving alongside the policy, producing verified trajectories.", "summary_zh": "由 Agent 构建的深层有状态电脑操作环境，随策略持续演化并产出经验证的轨迹。"}, {"name": "Simulate-to-Generalize", "title": "Simulate to Generalize: Scaling Stateful Supervision for API-calling Agents using LLM World Models", "arxiv": "2607.16900", "date": "2026-07", "domain": "Tool & API", "affiliations": ["Apple"], "code": "", "data": "", "summary_en": "From domain names, synthesizes APIs and tasks; an LLM world model tracks state and returns API responses to produce stateful trajectories.", "summary_zh": "仅从领域名称合成 API 与任务，由 LLM 世界模型跟踪状态并返回 API 响应，产出有状态轨迹。"}, {"name": "ToolVerse", "title": "ToolVerse: Unlocking Massive Environments and Long-Horizon Tasks for Agentic Reinforcement Learning", "arxiv": "2607.15660", "date": "2026-07", "domain": "Tool & API", "affiliations": ["Meituan", "Peking University", "Fudan University"], "code": "", "data": "", "summary_en": "Rewrites real MCP tool schemas into mock-database executable environments and samples long-horizon tasks by dynamic unlocking on dependency graphs.", "summary_zh": "把真实 MCP 工具定义改写为带模拟数据库的可执行环境，在依赖图上以动态解锁采样生成长程任务。"}, {"name": "SETA", "title": "SETA: Scaling Environments for Terminal Agents", "arxiv": "2607.10891", "date": "2026-07", "domain": "Terminal", "affiliations": ["CAMEL-AI.org", "Eigent.AI", "Imperial College London"], "code": "", "data": "", "summary_en": "Converts diverse sources into standardized RL environments, then evolves them with adaptive difficulty under unified verification.", "summary_zh": "将多种来源转换为标准化 RL 环境，并在统一验证下自适应调整难度、演化扩充。"}, {"name": "Qwen-AgentWorld", "title": "Qwen-AgentWorld: Language World Models for General Agents", "arxiv": "2606.24597", "date": "2026-06", "domain": "Tool & API", "affiliations": ["Alibaba"], "code": "https://github.com/QwenLM/Qwen-AgentWorld", "data": "https://huggingface.co/collections/Qwen/qwen-agentworld", "summary_en": "Trains language world models that predict next environment states across seven domains, used as controllable simulators for agentic RL.", "summary_zh": "训练预测 7 类环境下一状态的语言世界模型，作为 Agentic RL 的可控模拟器。"}, {"name": "PROVE", "title": "Synthesize and Reward -- Reinforcement Learning for Multi-Step Tool Use in Live Environments", "arxiv": "2606.03892", "date": "2026-06", "domain": "Tool & API", "affiliations": ["IBM"], "code": "", "data": "", "summary_en": "Session-isolated stateful MCP servers plus a state-machine pipeline that synthesizes tasks grounded in live server state with programmatic rewards.", "summary_zh": "会话隔离的有状态 MCP 服务，配合状态机流水线基于实时服务状态合成任务并给出程序化奖励。"}, {"name": "LiteCoder-Terminal", "title": "LiteCoder-Terminal: Scaling Long-Horizon Terminal Environments for Learning Language Agents", "arxiv": "2605.29559", "date": "2026-05", "domain": "Terminal", "affiliations": ["ISCAS", "UCAS"], "code": "", "data": "", "summary_en": "Zero-dependency pipeline synthesizing executable, verifiable long-horizon terminal environments directly from domain specifications.", "summary_zh": "不依赖外部仓库，直接从领域规格合成可执行、可验证的长程终端环境。"}, {"name": "PhoneWorld", "title": "PhoneWorld: From Real-App Trajectories to Dynamic and Verifiable Environments for Phone-Use Agents", "arxiv": "2605.29486", "date": "2026-05", "domain": "Web & GUI", "affiliations": ["Renmin University of China", "Tencent", "CUHK (Shenzhen)"], "code": "https://github.com/EthanLeo-LYX/PhoneWorld", "data": "https://huggingface.co/datasets/EthanLeoLYX/PhoneWorld-APKs", "summary_en": "Converts real-app trajectories into rebuilt dynamic Android apps with backend state, enabling verifiable phone-use RL tasks.", "summary_zh": "把真实 App 轨迹转化为带后端状态的重建 Android App，支持可验证的手机操作 RL 任务。"}, {"name": "ScaleWoB", "title": "ScaleWoB: Guiding GUI Agents with Coding Agents via Large-Scale Environmental Synthesis", "arxiv": "2605.25160", "date": "2026-05", "domain": "Web & GUI", "affiliations": ["Tsinghua University", "UESTC", "Xiaomi"], "code": "", "data": "", "summary_en": "Coding agents synthesize interactive web and mobile apps with verifiable tasks at scale for GUI agent training.", "summary_zh": "编码 Agent 大规模合成可交互的网页与移动 App 及可验证任务，用于 GUI Agent 训练。"}, {"name": "Terminal-World", "title": "Terminal-World: Scaling Terminal-Agent Environments via Agent Skills", "arxiv": "2605.20876", "date": "2026-05", "domain": "Terminal", "affiliations": ["Beihang University", "Beijing Institute of Technology", "University of Edinburgh"], "code": "", "data": "", "summary_en": "Uses agent skills as the synthesis primitive to co-derive instructions, environments, verifiers and teacher trajectories.", "summary_zh": "以 Agent 技能为合成单元，同时推导任务指令、环境、验证器与教师轨迹。"}, {"name": "EnvFactory", "title": "EnvFactory: Scaling Tool-Use Agents via Executable Environments Synthesis and Robust RL", "arxiv": "2605.18703", "date": "2026-05", "domain": "Tool & API", "affiliations": ["HKUST (Guangzhou)", "University of Cambridge", "UCL"], "code": "https://github.com/LARK-AI-Lab/EnvFactory", "data": "https://huggingface.co/datasets/LARK-Lab/EnvFactory-RL", "summary_en": "Search, coding and testing agents build verified stateful MCP environments from real resources; topology-aware sampling creates implicit-intent tasks.", "summary_zh": "搜索/编码/测试三类 Agent 基于真实资源构建经验证的有状态 MCP 环境，拓扑感知采样生成隐式意图任务。"}, {"name": "EvoEnv", "title": "Learning to Build the Environment: Self-Evolving Reasoning RL via Verifiable Environment Synthesis", "arxiv": "2605.14392", "date": "2026-05", "domain": "Reasoning", "affiliations": ["Tencent"], "code": "", "data": "", "summary_en": "The policy itself synthesizes new verifiable Python environments from seeds, co-evolving environment building and reasoning in one RL loop.", "summary_zh": "策略模型从种子环境出发自行合成新的可验证 Python 环境，在同一 RL 循环中协同提升环境构建与推理能力。"}, {"name": "Weblica", "title": "Weblica: Scalable and Reproducible Training Environments for Visual Web Agents", "arxiv": "2605.06761", "date": "2026-05", "domain": "Web & GUI", "affiliations": ["Apple"], "code": "", "data": "", "summary_en": "Builds reproducible web environments from LLM-synthesized sites and cached real pages, with generated tasks and verifiers.", "summary_zh": "以 LLM 合成站点与缓存真实网页构建可复现 Web 环境，并生成任务与验证器。"}, {"name": "Agent-World", "title": "Agent-World: Scaling Real-World Environment Synthesis for Evolving General Agent Intelligence", "arxiv": "2604.18292", "date": "2026-04", "domain": "Tool & API", "affiliations": ["Renmin University of China", "ByteDance"], "code": "https://github.com/RUC-NLPIR/Agent-World", "data": "https://huggingface.co/datasets/dongguanting/Agent-World-SFT-44K", "summary_en": "Agentically discovers databases and executable tool ecosystems from real MCP themes, then co-evolves environments and policy via self-evolving RL.", "summary_zh": "以 Agent 方式从真实 MCP 主题中发掘数据库与可执行工具生态，并通过自进化 RL 让环境与策略共同演化。"}, {"name": "TRUSTEE", "title": "Democratizing Tool Learning with Environments Fully Simulated by a Free 8B Language Model", "arxiv": "2604.17739", "date": "2026-04", "domain": "Tool & API", "affiliations": ["Tencent", "Peking University"], "code": "", "data": "", "summary_en": "An open 8B LM simulates the full environment, including tasks, users, tools and judging, with an adaptive curriculum for tool-use RL.", "summary_zh": "用开源 8B 模型模拟完整环境（任务、用户、工具与评判），配合自适应课程进行工具调用 RL。"}, {"name": "VeriEnv", "title": "Safe and Scalable Web Agent Learning via Recreated Websites", "arxiv": "2603.10505", "date": "2026-03", "domain": "Web & GUI", "affiliations": ["Georgia Tech"], "code": "https://github.com/kyle8581/VeriEnv", "data": "", "summary_en": "Coding agents recreate real websites as executable sandboxes with database access, enabling programmatically verifiable tasks.", "summary_zh": "编码 Agent 将真实网站复刻为可访问数据库的可执行沙盒，支持可程序化验证的任务。"}, {"name": "RepoLaunch", "title": "RepoLaunch: Automating Build and Management of Code Repositories across Languages and Platforms", "arxiv": "2603.05026", "date": "2026-03", "domain": "SWE", "affiliations": ["Microsoft"], "code": "https://github.com/microsoft/RepoLaunch", "data": "", "summary_en": "Agentic framework that resolves dependencies, compiles and extracts test results across languages and OSes for automated SWE task generation.", "summary_zh": "跨语言、跨操作系统自动解决依赖、编译并抽取测试结果，驱动全自动 SWE 任务生成。"}, {"name": "Reasoning Core", "title": "Reasoning Core: A Scalable Procedural Data Generation Suite for Symbolic Pre-training and Post-Training", "arxiv": "2603.02208", "date": "2026-03", "domain": "Reasoning", "affiliations": ["Université de Lille", "Inria", "CNRS"], "code": "https://github.com/sileod/reasoning_core", "data": "", "summary_en": "Procedural generators over planning, logic, grammars and probabilistic inference, verified by external solvers with continuous difficulty control.", "summary_zh": "覆盖规划、逻辑、文法与概率推断的程序化生成器，由外部求解器验证，难度连续可调。"}, {"name": "SWE-rebench V2", "title": "SWE-rebench V2: Language-Agnostic SWE Task Collection at Scale", "arxiv": "2602.23866", "date": "2026-02", "domain": "SWE", "affiliations": ["Nebius"], "code": "", "data": "https://huggingface.co/datasets/nebius/SWE-rebench-V2", "summary_en": "An interactive setup agent synthesizes repo-specific install and test procedures across 20 languages, with LLM-judge filtering.", "summary_zh": "交互式配置 Agent 为 20 种语言的仓库合成安装与测试流程，并以 LLM 评审过滤。"}, {"name": "Nemotron-Terminal", "title": "On Data Engineering for Scaling LLM Terminal Capabilities", "arxiv": "2602.21193", "date": "2026-02", "domain": "Terminal", "affiliations": ["NVIDIA"], "code": "", "data": "https://huggingface.co/collections/nvidia/nemotron-terminal", "summary_en": "Seed- and skill-based terminal task generation executed in Dockerized environments, with a systematic study of terminal data engineering.", "summary_zh": "基于种子与技能的终端任务生成并在 Docker 环境中执行，系统研究终端数据工程策略。"}, {"name": "ReSyn", "title": "ReSyn: Autonomously Scaling Synthetic Environments for Reas mbodied tasks and simulated scenes with multi-level rewards for LLM embodied RL.", "summary_zh": "多智能体数据引擎生成具身任务与仿真场景，配合多层级奖励进行 LLM 具身 RL。"}, {"name": "AgentScaler", "title": "Towards General Agentic Intelligence via Environment Scaling", "arxiv": "2509.13311", "date": "2025-09", "domain": "Tool & API", "affiliations": ["Alibaba"], "code": "", "data": "", "summary_en": "Automatically constructs fully simulated, heterogeneous function-calling environments and trains agents with a two-phase fine-tuning recipe.", "summary_zh": "自动构建完全模拟的异构函数调用环境，并以两阶段微调训练 Agent。"}, {"name": "SWE-Mirror", "title": "SWE-Mirror: Scaling Issue-Resolving Datasets by Mirroring Issues Across Repositories", "arxiv": "2509.08724", "date": "2025-09", "domain": "SWE", "affiliations": ["ByteDance", "CUHK"], "code": "", "data": "", "summary_en": "Distills real issues and re-instantiates them in repos that already have Gym environments, reusing environments to scale tasks.", "summary_zh": "提炼真实 issue 语义并移植到已有环境的仓库中，复用环境以扩充任务。"}, {"name": "InternBootcamp", "title": "InternBootcamp: Boosting LLM Reasoning with Verifiable Task Scaling", "arxiv": "2508.08636", "date": "2025-08", "domain": "Reasoning", "affiliations": ["Shanghai AI Laboratory", "Fudan University"], "code": "https://github.com/InternLM/InternBootcamp", "data": "", "summary_en": "Agent workflow auto-generates 1,000+ bootcamp environments, each with instance generator and verifier, for scalable verifiable-task RL.", "summary_zh": "Agent 工作流自动生成 1000 多个 Bootcamp 环境（含实例生成器与验证器），用于大规模可验证任务 RL。"}, {"name": "RepoForge", "title": "RepoForge: Training a SOTA Fast-thinking SWE Agent with an End-to-End Data Curation Pipeline Synergizing SFT and RL at Scale", "arxiv": "2508.01550", "date": "2025-08", "domain": "SWE", "affiliations": ["Huawei", "University of Waterloo", "Queen's University"], "code": "", "data": "", "summary_en": "Autonomously generates executable environments from GitHub commits with storage-efficient image pruning and distributed evaluation for RL.", "summary_zh": "从 GitHub commit 零人工生成可执行环境，配合镜像裁剪与分布式评测支撑 RL。"}, {"name": "WebSynthesis", "title": "WebSynthesis: World-Model-Guided MCTS for Efficient WebUI-Trajectory Synthesis", "arxiv": "2507.04370", "date": "2025-07", "domain": "Web & GUI", "affiliations": ["Beijing Jiaotong University"], "code": "https://github.com/LucusFigoGao/WebSynthesis", "data": "", "summary_en": "A learned web world model serves as a virtual environment; MCTS over it synthesizes WebUI trajectories without live websites.", "summary_zh": "以学习到的 Web 世界模型作为虚拟环境，在其上做 MCTS 合成 WebUI 轨迹，无需真实网站。"}, {"name": "Skywork-SWE", "title": "Skywork-SWE: Unveiling Data Scaling Laws for Software Engineering in LLMs", "arxiv": "2506.19290", "date": "2025-06", "domain": "SWE", "affiliations": ["Skywork AI"], "code": "", "data": "", "summary_en": "Incremental automated pipeline building per-instance runtime images with unit-test validation across thousands of Python repositories.", "summary_zh": "增量式自动流水线，为数千个 Python 仓库逐实例构建带单测验证的运行时镜像。"}, {"name": "SWE-Factory", "title": "SWE-Factory: Your Automated Factory for Issue Resolution Training Data and Evaluation Benchmarks", "arxiv": "2506.10954", "date": "2025-06", "domain": "SWE", "affiliations": ["Sun Yat-sen University", "Huawei"], "code": "https://github.com/DeepSoftwareAnalytics/swe-factory", "data": "", "summary_en": "Multi-agent builder generates Dockerfiles and eval scripts with an environment memory pool; exit-code grading automates fail-to-pass validation.", "summary_zh": "多智能体借助环境记忆池自动生成 Dockerfile 与评测脚本，以退出码判分自动完成 fail-to-pass 验证。"}, {"name": "SWE-Flow", "title": "SWE-Flow: Synthesizing Software Engineering Data in a Test-Driven Manner", "arxiv": "2506.09003", "date": "2025-06", "domain": "SWE", "affiliations": ["SIAT, CAS", "Alibaba", "Zhejiang University"], "code": "https://github.com/Hambaobao/SWE-Flow", "data": "", "summary_en": "Builds runtime dependency graphs from unit tests to derive incremental TDD steps, each with a partial codebase and verifiable tests.", "summary_zh": "由单元测试构建运行时依赖图，推导增量开发步骤，每步包含部分代码库与可验证测试。"}, {"name": "RandomWorld", "title": "Procedural Environment Generation for Tool-Use Agents", "arxiv": "2506.11045", "date": "2025-05", "domain": "Tool & API", "affiliations": ["Saarland University"], "code": "https://github.com/coli-saar/randomworld", "data": "", "summary_en": "Procedurally generates typed synthetic tools and composes non-linear tool-call DAGs into interactive environments for online RL and SFT.", "summary_zh": "基于类型体系程序化生成合成工具，并组合成非线性工具调用 DAG，构成用于在线 RL 与 SFT 的交互环境。"}, {"name": "Reasoning Gym", "title": "Reasoning Gym: Reasoning Environments for Reinforcement Learning with Verifiable Rewards", "arxiv": "2505.24760", "date": "2025-05", "domain": "Reasoning", "affiliations": ["Open-Thought", "Scale AI", "UCL"], "code": "https://github.com/open-thought/reasoning-gym", "data": "", "summary_en": "Library of 100+ procedural generators with verifiers over algebra, logic, games and graphs for unlimited, difficulty-controllable RLVR data.", "summary_zh": "100 多个带验证器的程序化生成器，覆盖代数、逻辑、游戏、图等，可无限生成难度可控的 RLVR 数据。"}, {"name": "SWE-rebench", "title": "SWE-rebench: An Automated Pipeline for Task Collection and Decontaminated Evaluation of Software Engineering Agents", "arxiv": "2505.20411", "date": "2025-05", "domain": "SWE", "affiliations": ["Nebius"], "code": "", "data": "https://huggingface.co/datasets/nebius/SWE-rebench", "summary_en": "Fully automated mining of GitHub PRs with LLM-generated install recipes and execution-based validation, yielding RL-ready SWE tasks.", "summary_zh": "全自动挖掘 GitHub PR，由 LLM 生成安装配置并经执行验证，产出可直接用于 RL 的 SWE 任务。"}, {"name": "Enigmata", "title": "Enigmata: Scaling Logical Reasoning in Large Language Models with Synthetic Verifiable Puzzles", "arxiv": "2505.19914", "date": "2025-05", "domain": "Reasoning", "affiliations": ["ByteDance", "Fudan University", "Tsinghua University"], "code": "https://github.com/BytedTsinghua-SIA/Enigmata", "data": "https://huggingface.co/datasets/BytedTsinghua-SIA/Enigmata-Data", "summary_en": "Puzzle suite pairing each task with an unlimited, difficulty-controllable generator and a rule-based verifier for multi-task RLVR.", "summary_zh": "每类谜题均配有可无限生成、难度可控的生成器与规则验证器，用于多任务 RLVR。"}, {"name": "SynLogic", "title": "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond", "arxiv": "2505.19641", "date": "2025-05", "domain": "Reasoning", "affiliations": ["HKUST", "MiniMax", "City University of Hong Kong"], "code": "https://github.com/MiniMax-AI/SynLogic", "data": "", "summary_en": "Synthesizes 35 logical reasoning task types with adjustable difficulty and rule-based verifiers, directly usable for RLVR.", "summary_zh": "合成 35 类难度可调、带规则验证器的逻辑推理任务，可直接用于 RLVR。"}, {"name": "KORGym", "title": "KORGym: A Dynamic Game Platform for LLM Reasoning Evaluation", "arxiv": "2505.14552", "date": "2025-05", "domain": "Reasoning", "affiliations": ["ByteDance", "M-A-P", "Beihang University"], "code": "https://github.com/multimodal-art-projection/KORGym", "data": "", "summary_en": "Gym-style platform of 50+ procedurally parameterized text and visual games supporting multi-turn interaction and RL.", "summary_zh": "Gym 风格平台，包含 50 多个参数化生成的文本/视觉游戏，支持多轮交互与 RL。"}, {"name": "SWE-smith", "title": "SWE-smith: Scaling Data for Software Engineering Agents", "arxiv": "2504.21798", "date": "2025-04", "domain": "SWE", "affiliations": ["Stanford University", "Princeton University", "Alibaba"], "code": "https://github.com/SWE-bench/SWE-smith", "data": "https://huggingface.co/datasets/SWE-bench/SWE-smith", "summary_en": "Builds one environment per repo, then synthesizes test-breaking bugs via LM rewrites, AST mutations, PR reversal and bug combination.", "summary_zh": "每个仓库只建一个环境，再通过 LM 改写、AST 变异、回退 PR 等方式合成使测试失败的 bug。"}, {"name": "SWE-Synth", "title": "SWE-Synth: Synthesizing Verifiable Bug-Fix Data to Enable Large Language Models in Resolving Real-World Bugs", "arxiv": "2504.14757", "date": "2025-04", "domain": "SWE", "affiliations": ["FPT Software AI Center", "Nanyang Technological University", "University of Texas at Dallas"], "code": "", "data": "", "summary_en": "LLM agents simulate debugging workflows to synthesize verifiable repository-level bug-fix pairs, tests and repair trajectories.", "summary_zh": "LLM Agent 模拟调试流程，合成可验证的仓库级 bug 修复对、测试用例与修复轨迹。"}, {"name": "R2E-Gym", "title": "R2E-Gym: Procedural Environments and Hybrid Verifiers for Scaling Open-Weights SWE Agents", "arxiv": "2504.07164", "date": "2025-04", "domain": "SWE", "affiliations": ["UC Berkeley", "Australian National University"], "code": "https://github.com/R2E-Gym/R2E-Gym", "data": "", "summary_en": "Curates executable environments directly from commits via test generation and issue back-translation, without relying on human-written issues.", "summary_zh": "通过测试生成与 issue 反向翻译，直接从 commit 程序化构建可执行环境，不依赖人工 issue。"}, {"name": "MirrorAPI", "title": "StableToolBench-MirrorAPI: Modeling Tool Environments as Mirrors of 7,000+ Real-World APIs", "arxiv": "2503.20527", "date": "2025-03", "domain": "Tool & API", "affiliations": ["Tsinghua University", "RayNeo", "Google"], "code": "", "data": "", "summary_en": "Fine-tunes LLMs on real request-response pairs to act as high-fidelity mirrors of real APIs for tool environments.", "summary_zh": "用真实请求-响应对微调 LLM，使其成为真实 API 的高保真镜像工具环境。"}, {"name": "Repo2Run", "title": "Repo2Run: Automated Building Executable Environment for Code Repository at Scale", "arxiv": "2502.13681", "date": "2025-02", "domain": "SWE", "affiliations": ["HIT (Shenzhen)", "ByteDance"], "code": "https://github.com/bytedance/Repo2Run", "data": "", "summary_en": "An LLM agent iteratively builds Docker images with rollback and unit-test checks, synthesizing runnable Dockerfiles for arbitrary repos.", "summary_zh": "LLM Agent 迭代构建 Docker 镜像（可回滚）并运行单测，为任意仓库合成可运行的 Dockerfile。"}, {"name": "SWE-Gym", "title": "Training Software Engineering Agents and Verifiers with SWE-Gym", "arxiv": "2412.21139", "date": "2024-12", "domain": "SWE", "affiliations": ["UC Berkeley", "UIUC", "CMU"], "code": "https://github.com/SWE-Gym/SWE-Gym", "data": "https://huggingface.co/SWE-Gym", "summary_en": "Pairs real GitHub issues with pre-installed executable runtimes and unit-test verification for training SWE agents and verifiers.", "summary_zh": "将真实 GitHub issue 与预装依赖的可执行运行时、单元测试验证结合，用于训练 SWE Agent 与验证器。"}, {"name": "AgentGen", "title": "AgentGen: Enhancing Planning Abilities for Large Language Model based Agent via Environment and Task Generation", "arxiv": "2408.00764", "date": "2024-08", "domain": "Game & Embodied", "affiliations": ["University of Hong Kong", "Microsoft"], "code": "", "data": "", "summary_en": "LLMs generate diverse PDDL/code environments from an inspiration corpus, then evolve tasks bidirectionally for controllable difficulty.", "summary_zh": "LLM 以灵感语料为种子生成多样的 PDDL/代码环境，再以双向演化生成难度可控的规划任务。"}]}]}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const COLORS = { "Tool & API": "#2563eb", "SWE": "#16a34a", "Terminal": "#64748b",
                   "Web & GUI": "#9333ea", "Game & Embodied": "#ea580c", "Reasoning": "#db2777" };
  const saved = localStorage.getItem("lang");
  const state = {
    lang: saved || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en"),
    q: "",
    domain: "all",
  };
  const all = D.modules.flatMap(m => m.entries);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const domainLabel = d => state.lang === "zh" ? D.domain_zh[d] : d;
  const haystack = e => [e.name, e.title, e.domain, D.domain_zh[e.domain], e.affiliations.join(" "),
                         e.summary_en, e.summary_zh].join(" ").toLowerCase();

  function matches(e) {
    if (state.domain !== "all" && e.domain !== state.domain) return false;
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const h = haystack(e);
    return terms.every(t => h.includes(t));
  }

  function card(e) {
    const t = D.i18n[state.lang];
    const links = [`<a class="pill" href="https://arxiv.org/abs/${esc(e.arxiv)}" target="_blank" rel="noopener">arXiv</a>`];
    if (e.code) links.push(`<a class="pill" href="${esc(e.code)}" target="_blank" rel="noopener">Code</a>`);
    if (e.data) links.push(`<a class="pill" href="${esc(e.data)}" target="_blank" rel="noopener">Data</a>`);
    const aff = e.affiliations.length ? e.affiliations.map(esc).join(" · ") : "-";
    return `<article class="card">
      <div class="meta"><span class="tag" style="--c:${COLORS[e.domain] || "#57606a"}">${esc(domainLabel(e.domain))}</span><span>${esc(e.date)}</span></div>
      <h3><a href="https://arxiv.org/abs/${esc(e.arxiv)}" target="_blank" rel="noopener">${esc(e.name)}</a></h3>
      <p class="ptitle">${esc(e.title)}</p>
      <p class="aff" title="${esc(t.aff)}">${aff}</p>
      <p class="sum">${esc(e["summary_" + state.lang])}</p>
      <div class="links">${links.join("")}</div>
    </article>`;
  }

  function render() {
    const t = D.i18n[state.lang];
    document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    document.getElementById("lang-btn").textContent = state.lang === "zh" ? "English" : "中文";
    document.getElementById("tagline").textContent = t.tagline;
    document.getElementById("intro").innerHTML = t.intro_html;
    document.getElementById("footer").innerHTML = t.footer_html;
    const search = document.getElementById("search");
    search.placeholder = t.search;
    if (search.value !== state.q) search.value = state.q;

    document.getElementById("toc").innerHTML = D.modules
      .map(m => `<a href="#${esc(m.slug)}">${esc(m["title_" + state.lang])}</a>`).join("");

    const counts = {};
    all.forEach(e => { counts[e.domain] = (counts[e.domain] || 0) + 1; });
    const domains = Object.keys(D.domain_zh).filter(d => counts[d]);
    document.getElementById("chips").innerHTML =
      `<button type="button" class="chip ${state.domain === "all" ? "on" : ""}" data-d="all">${esc(t.all)}<span class="n">${all.length}</span></button>` +
      domains.map(d => `<button type="button" class="chip ${state.domain === d ? "on" : ""}" data-d="${esc(d)}">${esc(domainLabel(d))}<span class="n">${counts[d]}</span></button>`).join("");

    let shown = 0;
    document.getElementById("main").innerHTML = D.modules.map(m => {
      const list = m.entries.filter(matches);
      shown += list.length;
      return `<section id="${esc(m.slug)}">
        <h2>${esc(m["title_" + state.lang])}</h2>
        <p class="desc">${m["desc_" + state.lang + "_html"]}</p>
        ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">${esc(t.none)}</p>`}
      </section>`;
    }).join("");
    document.getElementById("count").textContent = t.showing.replace("{n}", shown).replace("{m}", all.length);
  }

  document.getElementById("lang-btn").addEventListener("click", () => {
    state.lang = state.lang === "zh" ? "en" : "zh";
    localStorage.setItem("lang", state.lang);
    render();
  });
  document.getElementById("search").addEventListener("input", ev => { state.q = ev.target.value; render(); });
  document.getElementById("chips").addEventListener("click", ev => {
    const b = ev.target.closest(".chip");
    if (!b) return;
    state.domain = b.dataset.d;
    render();
  });
  render();
})();
</script>
</body>
</html>
