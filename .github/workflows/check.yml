name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate pages
        run: python3 scripts/build_readme.py
      - name: Ensure generated pages are up to date
        run: git diff --exit-code && test -z "$(git status --porcelain)"
